<title>Grooveville LLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout concept: the Grooveville tree. HQ is the trunk, six companies branch off it.
   Public side = storefront for each branch; Team side = one ledger with one slot per company. */
:root{
  --bg:#FBF6F2; --surface:#FFFFFF; --surface-2:#F5EEE7; --ink:#141B22; --muted:#56605C; --line:#E7DDD2;
  --peach:#F4A988; --peach-ink:#B4532E; --peach-soft:#FCE7DC;
  --olive:#5F6F25; --olive-soft:#E8ECD3;
  --teal:#0ABAB5; --teal-ink:#0A7471; --teal-soft:#D3F1EF;
  --ok:#4D7C0F; --warn:#B45309; --bad:#B91C1C;
  --c-hq:#0A7471; --c-ent:#C2582F; --c-music:#5F6F25; --c-vybr8:#0A9F9A; --c-pathd:#7F8F3E; --c-rentals:#D9794F; --c-w4w:#2F5E5B; --c-aec:#44511A; --c-scu:#2B3A55; --c-wit:#A86F1F;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(31,36,25,.06), 0 8px 24px -12px rgba(31,36,25,.18);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11150F; --surface:#191E15; --surface-2:#22291C; --ink:#F2EDE6; --muted:#A8AE9C; --line:#2E3727;
  --peach:#F6B396; --peach-ink:#F6A983; --peach-soft:#3A251C;
  --olive:#B2C26E; --olive-soft:#283019;
  --teal:#3FD0CB; --teal-ink:#6EDCD7; --teal-soft:#113533;
  --ok:#A3D65C; --warn:#F5B454; --bad:#F87171;
  --c-hq:#6EDCD7; --c-ent:#F6A983; --c-music:#B2C26E; --c-vybr8:#81D8D0; --c-pathd:#CBD78F; --c-rentals:#F8C4A9; --c-w4w:#86BDB8; --c-aec:#D5DE9F; --c-scu:#AEBCD9; --c-wit:#EBC27E;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11150F; --surface:#191E15; --surface-2:#22291C; --ink:#F2EDE6; --muted:#A8AE9C; --line:#2E3727;
  --peach:#F6B396; --peach-ink:#F6A983; --peach-soft:#3A251C;
  --olive:#B2C26E; --olive-soft:#283019;
  --teal:#3FD0CB; --teal-ink:#6EDCD7; --teal-soft:#113533;
  --ok:#A3D65C; --warn:#F5B454; --bad:#F87171;
  --c-hq:#6EDCD7; --c-ent:#F6A983; --c-music:#B2C26E; --c-vybr8:#81D8D0; --c-pathd:#CBD78F; --c-rentals:#F8C4A9; --c-w4w:#86BDB8; --c-aec:#D5DE9F; --c-scu:#AEBCD9; --c-wit:#EBC27E;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--teal-ink)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:2px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:18px;min-height:62px;flex-wrap:wrap;padding-block:8px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.logoimg{flex:none;border-radius:50%;display:block;box-shadow:0 0 0 1.5px var(--line)}
.links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.links a{text-decoration:none;color:var(--ink);padding:7px 12px;border-radius:999px;font-weight:500;font-size:14.5px}
.links a:hover{background:var(--surface-2)}
.links a.on{background:var(--ink);color:var(--bg)}
.links a.team{border:1.5px solid var(--olive);color:var(--olive)}
.links a.team.on{background:var(--olive);color:var(--bg)}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14.5px;text-decoration:none;background:var(--ink);color:var(--bg);transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.teal{background:var(--teal);color:#05302F}
.btn.peach{background:var(--peach);color:#3D1A0B}
.btn.olive{background:var(--olive);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input.i,select.i,textarea.i{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font-size:15px;font-weight:400;color:var(--ink)}
textarea.i{min-height:96px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--teal);outline:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--teal)) 15%,transparent);color:var(--c,var(--teal-ink));white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--teal))}
.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px}
.pill.pub{background:var(--teal-soft);color:var(--teal-ink)}
.pill.priv{background:var(--surface-2);color:var(--muted)}
.pill.high{background:var(--peach-soft);color:var(--peach-ink)}
.pill.over{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}

section{padding-block:56px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}

/* hero */
.hero{padding-block:48px 36px}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:center}
.hero h1{font-size:clamp(38px,6vw,72px);font-weight:800;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--teal-ink)}
.hero h1 span{color:var(--peach-ink)}
.hero .lede{font-size:18px;color:var(--muted);max-width:52ch;margin-top:18px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.tree{width:100%;height:auto;max-width:100%}
.tree .node{cursor:pointer}
.tree .node:hover circle.ring,.tree .node:focus circle.ring{stroke-width:4}
.tree text{font-family:var(--f-display);font-weight:700}

.branches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.branch{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative;overflow:hidden;transition:border-color .15s, transform .15s}
.branch:hover{border-color:var(--c);transform:translateY(-2px)}
.blogo{width:48px;height:48px;border-radius:12px;object-fit:contain;background:var(--surface);border:1px solid var(--line);padding:4px;flex:none}
.blogo.big{width:96px;height:96px;border-radius:20px;padding:8px;margin-bottom:16px;display:block}
.branch .mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.branch h3{font-size:21px}
.branch p{color:var(--muted);font-size:14.5px}
.branch .go{margin-top:auto;font-weight:600;font-size:14px;color:var(--c)}
.hqband{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:var(--olive);color:var(--bg);border-radius:var(--r);padding:22px 24px;margin-bottom:14px}
.hqband h3{font-size:24px}
.hqband p{opacity:.85;max-width:60ch}
.hqband .btn{margin-left:auto;background:var(--bg);color:var(--ink)}

.sechead{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sechead h2{font-size:clamp(28px,3.6vw,40px);font-weight:800}

.evlist{display:grid;gap:10px}
.ev{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.ev .date{text-align:center;border-right:1px solid var(--line);padding-right:14px}
.ev .date b{display:block;font-family:var(--f-display);font-size:28px;line-height:1}
.ev .date small{font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.ev h4{font-size:17px;font-family:var(--f-body);font-weight:600;letter-spacing:0}
.ev .meta{font-size:13.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:3px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted)}

.cta{background:var(--peach-soft);border-radius:22px;padding:36px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center}
.cta h2{font-size:clamp(26px,3.4vw,38px);font-weight:800;color:var(--peach-ink)}
footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:13.5px}
footer .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}

/* brand page */
.bhero{padding-block:56px 40px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,var(--bg)),var(--bg))}
.bhero h1{font-size:clamp(40px,7vw,84px);font-weight:800;letter-spacing:-.04em;color:var(--c)}
.bhero .tag{font-size:20px;max-width:46ch;margin-top:12px}
.bhero .crumb{font-size:13px;color:var(--muted);margin-bottom:14px}
.bhero .crumb a{color:var(--muted)}
.bcols{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
.links-list{display:flex;flex-direction:column;gap:10px}

/* calendar */
.calbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.calbar h3{font-size:24px;min-width:170px}
.calwrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px;min-width:660px}
.cal .dow{background:var(--surface-2);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px}
.cal .day{background:var(--surface);min-height:104px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;border:0;border-radius:0}
.cal .day:hover{background:var(--surface-2)}
.cal .day.out{background:var(--bg);color:var(--muted)}
.cal .day .n{font-family:var(--f-mono);font-size:12.5px;font-weight:600}
.cal .day.today .n{background:var(--teal);color:#05302F;border-radius:999px;padding:1px 7px;align-self:flex-start}
.cal .it{font-size:11.5px;line-height:1.3;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c)}
.cal .it.rem{border-left-style:dotted;background:transparent}
.cal .it.priv{opacity:.85}
.cal .more{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* team */
.teamhead{padding-block:28px 6px}
.teamhead h1{font-size:clamp(30px,4vw,44px);font-weight:800}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-top:18px}
.tabs a{text-decoration:none;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:2.5px solid transparent;margin-bottom:-1px;font-size:14.5px}
.tabs a.on{color:var(--ink);border-color:var(--olive)}
.tsec{padding-block:24px 56px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r-sm);background:var(--teal-soft);color:var(--teal-ink);font-weight:500;margin-top:16px}
.banner .btn{margin-left:auto}
.banner.warn{background:var(--peach-soft);color:var(--peach-ink)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:600;margin-top:4px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.slot{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.slot h4{font-size:17px}
.slot .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot .nums div{background:var(--surface-2);border-radius:8px;padding:7px 8px}
.slot .nums small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.slot .nums span{font-family:var(--f-mono);font-size:14.5px;font-weight:600}
.moneyin{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;background:var(--olive-soft);border-radius:8px;padding:8px 10px}
.moneyin div{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.moneyin small{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--olive);text-transform:uppercase}
.moneyin b{font-size:15px}
.moneyin span{font-size:12px;color:var(--muted);flex-basis:100%;order:3}
.moneyin .btn{padding:4px 10px;font-size:12px}
.slot .next{font-size:13px;color:var(--muted);min-height:20px}
.slot .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.cols2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .sp{flex:1}
.brandtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.brandtabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);display:inline-flex;gap:7px;align-items:center}
.brandtabs button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink))}
.brandtabs button.on{border-color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--ink)) 13%,var(--surface))}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
table.t th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.num,table.t th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
.neg{color:var(--peach-ink)} .pos{color:var(--ok)}
.typ{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface-2);white-space:nowrap}
.typ.meeting{background:var(--teal-soft);color:var(--teal-ink)}
.typ.expense,.typ.receipt{background:var(--peach-soft);color:var(--peach-ink)}
.typ.income{background:var(--olive-soft);color:var(--olive)}
.rowbtn{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:3px 6px;border-radius:6px;font-size:13px}
.rowbtn:hover{background:var(--surface-2);color:var(--ink)}
.thumb{width:34px;height:34px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;vertical-align:middle}
.remgroup{margin-bottom:22px}
.remgroup h4{font-family:var(--f-body);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.rem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px}
.rem.done{opacity:.55}
.rem.done .rt{text-decoration:line-through}
.rem input[type=checkbox]{width:19px;height:19px;accent-color:var(--olive);margin-top:2px}
.rem .rt{font-weight:600}
.rem .rm{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;font-size:15px;white-space:pre-wrap;line-height:1.65;font-family:var(--f-body)}
.letter .lh{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--teal-ink);white-space:normal;display:flex;align-items:center;gap:10px;margin-bottom:14px;border-bottom:2px solid var(--peach);padding-bottom:12px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(17,21,15,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px}
.modal{background:var(--bg);border-radius:18px;width:100%;max-width:620px;padding:24px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.modal h3{font-size:24px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.modal .row .left{margin-right:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.gate{max-width:560px;margin:60px auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.gate h1{font-size:36px;font-weight:800}

@media (max-width:900px){
  .hero .wrap,.cta,.bcols,.cols2{grid-template-columns:1fr}
  .branches{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  .branches{grid-template-columns:1fr}
  .links{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}
  .links a{white-space:nowrap}
  .ev{grid-template-columns:56px minmax(0,1fr)}
  .ev .act{grid-column:1/-1}
  section{padding-block:40px}
  .cta{padding:24px}
  .hqband .btn{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
