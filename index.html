<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Grooveville LLC, The Creative House: nine companies, one Groove, rooted in Charlotte, NC.">
<meta name="theme-color" content="#101112">
<link rel="icon" href="logo.webp">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Grooveville LLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  /* Creative House palette: charcoal, peach, cream, white. Cyan, lavender and lime only as glows and accents. */
  --bg:#101112; --surface:#17191B; --surface-2:#202326; --ink:#F3EFE7; --muted:#A9A49B; --line:#2B2E31;
  --cream:#F3EFE7; --cream-ink:#17181A; --cream-muted:#5E5850; --white:#FFFFFF;
  --peach:#F4A987; --peach-ink:#F4A987; --peach-soft:#2E211B;
  --olive:#B9C978; --olive-soft:#262B1A;
  --teal:#68D4D0; --teal-ink:#68D4D0; --teal-soft:#14302F;
  --lav:#B7A1E5; --lime:#B9C978; --cyan:#68D4D0;
  --ok:#B9C978; --warn:#F4C27A; --bad:#F26B6B;
  --c-hq:#F4A987; --c-ent:#F6A983; --c-music:#B2C26E; --c-aelio:#B2C26E; --c-vybr8:#81D8D0; --c-pathd:#CBD78F; --c-rentals:#F8C4A9; --c-w4w:#86BDB8; --c-aec:#D5DE9F; --c-scu:#B7A1E5; --c-wit:#EBC27E;
  --f-display:"Inter Tight", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--teal-ink)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:2px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:18px;min-height:62px;flex-wrap:wrap;padding-block:8px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.logoimg{flex:none;border-radius:50%;display:block;box-shadow:0 0 0 1.5px var(--line)}
.links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.links a{text-decoration:none;color:var(--ink);padding:7px 12px;border-radius:999px;font-weight:500;font-size:14.5px}
.links a:hover{background:var(--surface-2)}
.links a.on{background:var(--ink);color:var(--bg)}
.links a.team{border:1.5px solid var(--olive);color:var(--olive)}
.links a.team.on{background:var(--olive);color:var(--bg)}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14.5px;text-decoration:none;background:var(--ink);color:var(--bg);transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.teal{background:var(--teal);color:#05302F}
.btn.peach{background:var(--peach);color:#3D1A0B}
.btn.olive{background:var(--olive);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input.i,select.i,textarea.i{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font-size:15px;font-weight:400;color:var(--ink)}
textarea.i{min-height:96px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--teal);outline:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--teal)) 15%,transparent);color:var(--c,var(--teal-ink));white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--teal))}
.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px}
.pill.pub{background:var(--teal-soft);color:var(--teal-ink)}
.pill.priv{background:var(--surface-2);color:var(--muted)}
.pill.high{background:var(--peach-soft);color:var(--peach-ink)}
.pill.over{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}

section{padding-block:56px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}

/* hero */
.hero{padding-block:48px 36px}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:center}
.hero h1{font-size:clamp(38px,6vw,72px);font-weight:800;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--teal-ink)}
.hero h1 span{color:var(--peach-ink)}
.hero .lede{font-size:18px;color:var(--muted);max-width:52ch;margin-top:18px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.tree{width:100%;height:auto;max-width:100%}
.tree .node{cursor:pointer}
.tree .node:hover circle.ring,.tree .node:focus circle.ring{stroke-width:4}
.tree text{font-family:var(--f-display);font-weight:700}

.branches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.branch{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative;overflow:hidden;transition:border-color .15s, transform .15s}
.branch:hover{border-color:var(--c);transform:translateY(-2px)}
.blogo{width:48px;height:48px;border-radius:12px;object-fit:contain;background:var(--surface);border:1px solid var(--line);padding:4px;flex:none}
.blogo.big{width:96px;height:96px;border-radius:20px;padding:8px;margin-bottom:16px;display:block}
.branch .mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.branch h3{font-size:21px}
.branch p{color:var(--muted);font-size:14.5px}
.branch .go{margin-top:auto;font-weight:600;font-size:14px;color:var(--c)}
body.sc-mode{overflow:hidden;background:#07050d}
body.sc-mode .nav,body.sc-mode footer{display:none}
.sc-frame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:30;background:#07050d;display:block}
.backbtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer;margin-right:10px}
.backbtn:hover{border-color:var(--c,var(--ink))}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:26px;border-bottom:1px solid var(--line)}
.subtabs>a,.subtabs>button{border:0;background:none;font:inherit;font-weight:600;font-size:15px;color:var(--muted);padding:10px 14px;border-bottom:2.5px solid transparent;margin-bottom:-1px;cursor:pointer;text-decoration:none}
.subtabs>.on{color:var(--ink);border-color:var(--c)}
.subtabs>.subtab-portal{color:#fff;background:linear-gradient(135deg,#7a1fe0,#b44dff 55%,#ff8b32);border-radius:999px 999px 0 0;border-bottom-color:#b44dff}
.portalcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;width:100%;text-align:left;cursor:pointer;text-decoration:none;color:#f4ecff;border:1px solid #9c45ff;border-radius:18px;padding:20px 24px;background:radial-gradient(circle at 12% 50%,#5a1a9a 0,#1a0b2e 45%,#0c0616 100%);box-shadow:0 0 0 1px #9c45ff33,0 18px 50px -20px #8a2bff;font:inherit;transition:transform .2s,box-shadow .2s}
.portalcard:hover{transform:translateY(-2px);box-shadow:0 0 0 1px #c07bff66,0 22px 60px -18px #a447ff}
.portalcard b{display:block;font-family:var(--f-display);font-size:clamp(22px,3vw,30px);margin:4px 0}
.portalcard .pc-text span:last-child{color:#cdbbe6;font-size:14.5px}
.portalcard .pc-go{font-weight:800;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,#9a35ff,#5a13ba);white-space:nowrap}
.swirl{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 0deg,#2a0750,#9a35ff,#ff8bf5,#6b1bd8,#ff8b32,#2a0750);animation:spin 3.2s linear infinite;box-shadow:0 0 30px #a64cff}
.swirl i{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,#fff6ff 0,#d58bff 30%,#3d0a78 75%)}
@keyframes spin{to{transform:rotate(360deg)}}
.portal-ov{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:transparent}
.portal-ov canvas{position:absolute;inset:0}
.portal-ov.calm{background:#12041f;animation:pfade .5s ease forwards}
@keyframes pfade{from{opacity:0}to{opacity:1}}
.portal-txt{position:relative;color:#fff;font-family:var(--f-display);font-weight:800;font-size:clamp(18px,2.6vw,28px);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 18px #b44dff;display:flex;flex-direction:column;align-items:center;gap:6px;animation:ptxt 1.9s ease forwards}
.portal-txt span{font-size:42px}
@keyframes ptxt{0%{opacity:0;transform:scale(.9)}25%{opacity:1}75%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(1.4)}}
@media (max-width:560px){.portalcard{grid-template-columns:1fr;justify-items:start}.swirl{width:64px;height:64px}.swirl i{width:40px;height:40px}}
@media (prefers-reduced-motion:reduce){.swirl{animation:none}}
.hqband{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:var(--olive);color:var(--bg);border-radius:var(--r);padding:22px 24px;margin-bottom:14px}
.hqband h3{font-size:24px}
.hqband p{opacity:.85;max-width:60ch}
.hqband .btn{margin-left:auto;background:var(--bg);color:var(--ink)}

.sechead{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sechead h2{font-size:clamp(28px,3.6vw,40px);font-weight:800}

.evlist{display:grid;gap:10px}
.ev{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.ev .date{text-align:center;border-right:1px solid var(--line);padding-right:14px}
.ev .date b{display:block;font-family:var(--f-display);font-size:28px;line-height:1}
.ev .date small{font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.ev h4{font-size:17px;font-family:var(--f-body);font-weight:600;letter-spacing:0}
.ev .meta{font-size:13.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:3px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted)}

.cta{background:var(--peach-soft);border-radius:22px;padding:36px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center}
.cta h2{font-size:clamp(26px,3.4vw,38px);font-weight:800;color:var(--peach-ink)}
footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:13.5px}
footer .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}

/* brand page */
.bhero{padding-block:56px 40px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,var(--bg)),var(--bg))}
.bhero h1{font-size:clamp(40px,7vw,84px);font-weight:800;letter-spacing:-.04em;color:var(--c)}
.bhero .tag{font-size:20px;max-width:46ch;margin-top:12px}
.bhero .crumb{font-size:13px;color:var(--muted);margin-bottom:14px}
.bhero .crumb a{color:var(--muted)}
.bcols{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
.links-list{display:flex;flex-direction:column;gap:10px}

/* calendar */
.calbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.calbar h3{font-size:24px;min-width:170px}
.calwrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px;min-width:660px}
.cal .dow{background:var(--surface-2);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px}
.cal .day{background:var(--surface);min-height:104px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;border:0;border-radius:0}
.cal .day:hover{background:var(--surface-2)}
.cal .day.out{background:var(--bg);color:var(--muted)}
.cal .day .n{font-family:var(--f-mono);font-size:12.5px;font-weight:600}
.cal .day.today .n{background:var(--teal);color:#05302F;border-radius:999px;padding:1px 7px;align-self:flex-start}
.cal .it{font-size:11.5px;line-height:1.3;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c)}
.cal .it.rem{border-left-style:dotted;background:transparent}
.cal .it.priv{opacity:.85}
.cal .more{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* team */
.teamhead{padding-block:28px 6px}
.teamhead h1{font-size:clamp(30px,4vw,44px);font-weight:800}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-top:18px}
.tabs a{text-decoration:none;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:2.5px solid transparent;margin-bottom:-1px;font-size:14.5px}
.tabs a.on{color:var(--ink);border-color:var(--olive)}
.tsec{padding-block:24px 56px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r-sm);background:var(--teal-soft);color:var(--teal-ink);font-weight:500;margin-top:16px}
.banner .btn{margin-left:auto}
.banner.warn{background:var(--peach-soft);color:var(--peach-ink)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:600;margin-top:4px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.slot{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.slot h4{font-size:17px}
.slot .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot .nums div{background:var(--surface-2);border-radius:8px;padding:7px 8px}
.slot .nums small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.slot .nums span{font-family:var(--f-mono);font-size:14.5px;font-weight:600}
.moneyin{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;background:var(--olive-soft);border-radius:8px;padding:8px 10px}
.moneyin div{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.moneyin small{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--olive);text-transform:uppercase}
.moneyin b{font-size:15px}
.moneyin span{font-size:12px;color:var(--muted);flex-basis:100%;order:3}
.moneyin .btn{padding:4px 10px;font-size:12px}
.slot .next{font-size:13px;color:var(--muted);min-height:20px}
.slot .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.cols2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .sp{flex:1}
.brandtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.brandtabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);display:inline-flex;gap:7px;align-items:center}
.brandtabs button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink))}
.brandtabs button.on{border-color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--ink)) 13%,var(--surface))}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
table.t th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.num,table.t th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
.neg{color:var(--peach-ink)} .pos{color:var(--ok)}
.typ{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface-2);white-space:nowrap}
.typ.meeting{background:var(--teal-soft);color:var(--teal-ink)}
.typ.expense,.typ.receipt{background:var(--peach-soft);color:var(--peach-ink)}
.typ.income{background:var(--olive-soft);color:var(--olive)}
.rowbtn{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:3px 6px;border-radius:6px;font-size:13px}
.rowbtn:hover{background:var(--surface-2);color:var(--ink)}
.thumb{width:34px;height:34px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;vertical-align:middle}
.remgroup{margin-bottom:22px}
.remgroup h4{font-family:var(--f-body);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.rem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px}
.rem.done{opacity:.55}
.rem.done .rt{text-decoration:line-through}
.rem input[type=checkbox]{width:19px;height:19px;accent-color:var(--olive);margin-top:2px}
.rem .rt{font-weight:600}
.rem .rm{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;font-size:15px;white-space:pre-wrap;line-height:1.65;font-family:var(--f-body)}
.letter .lh{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--teal-ink);white-space:normal;display:flex;align-items:center;gap:10px;margin-bottom:14px;border-bottom:2px solid var(--peach);padding-bottom:12px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(17,21,15,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px}
.modal{background:var(--bg);border-radius:18px;width:100%;max-width:620px;padding:24px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.modal h3{font-size:24px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.modal .row .left{margin-right:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.gate{max-width:560px;margin:60px auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.gate h1{font-size:36px;font-weight:800}

/* ===== Creative House ===== */
.nav{background:color-mix(in srgb,#0b0c0d 72%,transparent);border-bottom:1px solid #ffffff12}
.logo{color:var(--white);font-weight:700;font-size:21px}
.logoimg{box-shadow:none}
.links a{color:#e9e4dc;font-size:14px}
.links a:hover{background:#ffffff10}
.links a.on{background:var(--peach);color:#1b120c}
.links a.team{border:1.3px solid var(--peach);color:var(--peach)}
.links a.team.on{background:var(--peach);color:#1b120c}
.soundbtn{border:0;background:none;color:#cfc9bf;font:600 11px/1 var(--f-body);letter-spacing:.18em;display:inline-flex;align-items:center;gap:7px;cursor:pointer;padding:8px 6px;text-transform:uppercase}
.soundbtn .bars{display:inline-flex;gap:2px;align-items:end;height:12px}
.soundbtn .bars i{width:2px;background:currentColor;height:4px;border-radius:2px}
.soundbtn.on{color:var(--peach)}
.soundbtn.on .bars i{animation:eq 1s ease-in-out infinite}
.soundbtn.on .bars i:nth-child(2){animation-delay:.2s}.soundbtn.on .bars i:nth-child(3){animation-delay:.4s}.soundbtn.on .bars i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.btn{letter-spacing:.01em}
.btn.peach{background:var(--peach);color:#1b120c}
.btn.line{background:transparent;color:var(--white);border:1.3px solid #ffffff55}
.btn.line:hover{border-color:var(--peach);color:var(--peach)}
.arrowbtn{width:46px;height:46px;border-radius:50%;border:1.3px solid currentColor;display:inline-grid;place-items:center;color:var(--peach);background:transparent;cursor:pointer;flex:none;text-decoration:none;font-size:18px;transition:background .2s,color .2s}
.arrowbtn:hover{background:var(--peach);color:#1b120c;border-color:var(--peach)}
.kicker{font:600 11.5px/1.2 var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:var(--peach)}
.disp{font-family:var(--f-display);font-weight:700;letter-spacing:-.035em;line-height:.98}
/* intro */
.intro{position:fixed;inset:0;z-index:300;background:#0b0a0c;color:#fff;overflow:hidden;transition:opacity .9s ease,visibility .9s}
.intro.out{opacity:0;visibility:hidden}
.intro canvas,.intro video,.intro .ipost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.intro .ishade{position:absolute;inset:0;background:linear-gradient(180deg,#0006 0,transparent 30%,transparent 55%,#000c 100%)}
.intro .itop{position:absolute;top:0;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:26px clamp(18px,4vw,44px);font:600 12px/1.6 var(--f-body);letter-spacing:.28em;text-transform:uppercase}
.intro .itop .c{text-align:center;color:#ffffffcc}
.intro .itop .r{justify-self:end;display:flex;gap:10px;align-items:center}
.intro .brandmark b{display:block;font-size:17px;letter-spacing:.32em;font-weight:600}
.intro .brandmark span{color:#ffffffaa;font-size:10.5px}
.intro .icenter{position:absolute;left:0;right:0;bottom:clamp(26px,6vh,60px);display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center;padding:0 16px}
.intro .tagline{font:500 13px/1.4 var(--f-body);letter-spacing:.42em;text-transform:uppercase;color:#fff}
.intro .gobtn{display:inline-flex;align-items:center;gap:22px;background:var(--peach);color:#1b120c;border:0;border-radius:999px;padding:8px 8px 8px 34px;font:700 13px/1 var(--f-body);letter-spacing:.24em;cursor:pointer;box-shadow:0 10px 40px -10px #f4a98799}
.intro .gobtn i{width:42px;height:42px;border-radius:50%;background:#141516;color:#fff;display:grid;place-items:center;font-style:normal;font-size:18px;letter-spacing:0;transition:transform .2s}
.intro .gobtn:hover i{transform:translateX(3px)}
.intro .skip{background:none;border:0;color:#ffffffaa;font:600 11px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.intro .await{position:absolute;left:16px;bottom:12px;font-size:10.5px;color:#ffffff66;letter-spacing:.08em}
/* home */
.hh{position:relative;min-height:min(86vh,820px);display:flex;align-items:center;overflow:hidden;padding:0;background:#0d0d0e}
.hh .bgimg{position:absolute;inset:0 0 0 38%;}
.hh .bgimg img{width:100%;height:100%;object-fit:cover}
.hh .bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0d0d0e 0,#0d0d0ee6 14%,#0d0d0e55 46%,#0d0d0e22 70%,#0d0d0e88 100%),linear-gradient(0deg,#0d0d0e 0,transparent 30%)}
.hh .glow{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.28;pointer-events:none}
.hh .wrap{position:relative;width:100%;padding-block:90px}
.hh h1{font-size:clamp(46px,8.2vw,112px);color:var(--white);max-width:9.5ch}
.hh h1 em{font-style:normal;color:var(--peach);display:block}
.hh p{color:#e4ded5;font-size:clamp(16px,1.6vw,19px);max-width:44ch;margin-top:26px}
.hh .ctas{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:34px}
.playlink{display:inline-flex;align-items:center;gap:12px;color:#fff;background:none;border:0;cursor:pointer;font:600 14.5px var(--f-body)}
.playlink span{width:44px;height:44px;border-radius:50%;border:1.3px solid #ffffff88;display:grid;place-items:center;font-size:13px}
.hh .loc{position:absolute;right:clamp(16px,4vw,44px);bottom:30px;text-align:right;font:600 11px/1.7 var(--f-body);letter-spacing:.24em;color:#ffffffbb;text-transform:uppercase}
.hh .loc b{color:var(--peach);font-weight:600}
.vinesec{position:relative;overflow:hidden;background:radial-gradient(60% 70% at 85% 60%,#b7a1e51f,transparent 70%),radial-gradient(40% 50% at 8% 10%,#68d4d014,transparent 70%),#0f1011;padding-block:90px}
.vinesec .wrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:40px;align-items:center}
.vinesec h2,.secT{font-size:clamp(38px,5.4vw,68px);color:var(--white)}
.vinesec p{color:#cfc9bf;margin-top:20px;max-width:34ch;font-size:17px}
.textlink{display:inline-flex;align-items:center;gap:16px;margin-top:34px;color:#fff;text-decoration:none;font:600 12px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;background:none;border:0;cursor:pointer}
.vtip{position:fixed;z-index:70;max-width:260px;background:#151617f2;border:1px solid #ffffff1f;border-radius:14px;padding:14px 16px;box-shadow:0 20px 50px -20px #000;pointer-events:auto;backdrop-filter:blur(8px)}
.vtip b{display:block;font:700 17px var(--f-display);color:#fff}
.vtip small{display:block;font:600 10.5px var(--f-body);letter-spacing:.18em;color:var(--c,var(--peach));text-transform:uppercase;margin-bottom:4px}
.vtip p{color:#cfc9bf;font-size:13.5px;margin:6px 0 10px}
.vtip a{color:var(--peach);font-weight:700;font-size:13px;text-decoration:none}
.tree .node:hover,.tree .node:focus{filter:drop-shadow(0 0 10px var(--hl,#fff6))}
.tree .node:focus{outline:none}
.vinelist{display:none;flex-wrap:wrap;gap:8px;margin-top:22px}
.vinelist a{text-decoration:none}
.gal{background:var(--cream);color:var(--cream-ink);padding-block:84px 90px}
.gal .kicker{color:#4b4640}
.gal h2{font-size:clamp(36px,4.8vw,58px);color:var(--cream-ink)}
.gal .ghead{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:34px}
.gal .count{margin-left:auto;display:flex;gap:14px;align-items:center;font:600 13px var(--f-mono);color:#4b4640}
.gal .count button{background:none;border:0;font-size:20px;cursor:pointer;color:var(--cream-ink);padding:4px 8px}
.cards{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,23%);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin}
.vcard{position:relative;scroll-snap-align:start;aspect-ratio:4/5;border-radius:16px;overflow:hidden;text-decoration:none;color:#fff;background:#1b1c1e;display:block;isolation:isolate}
.vcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.vcard:hover img{transform:scale(1.05)}
.vcard::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000d 0,#0006 32%,transparent 60%);z-index:0}
.vcard .vc{position:absolute;left:18px;right:18px;bottom:18px;z-index:1;display:flex;align-items:flex-end;gap:10px}
.vcard h3{font:700 clamp(22px,2vw,28px)/1 var(--f-display);letter-spacing:-.02em}
.vcard small{display:block;font:600 10.5px/1.4 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:#ffffffcc;margin-top:6px}
.vcard .arrowbtn{margin-left:auto;width:40px;height:40px;color:#fff;border-color:#ffffff99}
.vcard .art{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(70% 60% at 30% 25%,color-mix(in srgb,var(--c) 70%,transparent),transparent 70%),radial-gradient(60% 60% at 80% 90%,#b7a1e540,transparent 70%),#151617}
.vcard .art b{font:800 54px var(--f-display);letter-spacing:-.04em;color:#ffffff26}
.vcard .tag{position:absolute;top:14px;left:14px;z-index:1;font:700 10px var(--f-body);letter-spacing:.18em;background:#000a;color:#fff;padding:5px 9px;border-radius:999px;text-transform:uppercase}
.vcard.aelio .art{background:radial-gradient(70% 60% at 50% 30%,#ffb54766,transparent 70%),#08090b}
.culture{background:#0f1011;padding-block:84px}
.culture .wrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.5fr);gap:40px}
.evx{display:grid;grid-template-columns:86px 64px minmax(0,1fr) auto;gap:18px;align-items:center;padding:16px 0;border-bottom:1px solid #ffffff14;color:#fff;text-decoration:none;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer;font:inherit}
.evx:first-child{border-top:1px solid #ffffff14}
.evx .d{font:600 13px var(--f-body);letter-spacing:.14em;color:var(--peach);text-transform:uppercase}
.evx .th{width:64px;height:48px;border-radius:8px;object-fit:cover;background:#1d1f22}
.evx .t{font-weight:600;font-size:16px}
.evx .w{font:600 10.5px var(--f-body);letter-spacing:.2em;color:#ffffff88;text-transform:uppercase;text-align:right}
.split{display:grid;grid-template-columns:1fr 1fr;min-height:520px;background:#0c0d0e}
.split .ph{position:relative;min-height:340px;overflow:hidden}
.split .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.split .tx{display:flex;flex-direction:column;justify-content:center;padding:70px clamp(20px,6vw,90px)}
.split .tx p{color:#cfc9bf;font-size:17px;max-width:40ch;margin-top:18px}
.split.cream{background:var(--cream);color:var(--cream-ink)}
.split.cream .secT{color:var(--cream-ink)}
.split.cream p{color:var(--cream-muted)}
.split.cream .kicker{color:#7a5a46}
.split.cream .arrowbtn{color:var(--cream-ink)}
footer.ft{background:#0b0b0c;border-top:1px solid #ffffff12;padding-block:56px 30px;color:#a9a49b}
footer.ft .wrap{display:block}
footer.ft .fgrid{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:28px}
footer.ft h4{font:600 11px var(--f-body);letter-spacing:.22em;text-transform:uppercase;color:#fff;margin-bottom:12px}
footer.ft a{color:#cfc9bf;text-decoration:none;display:block;padding:3px 0;font-size:14px}
footer.ft a:hover{color:var(--peach)}
footer.ft .legal{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-top:1px solid #ffffff12;margin-top:36px;padding-top:20px;font-size:13px}
/* brand pages (dark) */
.bhero{background:radial-gradient(70% 90% at 90% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%),#0f1011;position:relative;overflow:hidden}
.bhero.hasimg{min-height:440px;display:flex;align-items:flex-end}
.bhero .bimg{position:absolute;inset:0}
.bhero .bimg img{width:100%;height:100%;object-fit:cover;opacity:.45}

.bhero .wrap{position:relative;width:100%}
.bhero h1{color:var(--white)}
.bhero h1 .acc{color:var(--c)}

/* music */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.mitem{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink)}
.mitem .cov{aspect-ratio:1;border-radius:12px;overflow:hidden;background:radial-gradient(70% 70% at 30% 20%,#f4a98755,transparent 70%),radial-gradient(60% 60% at 80% 90%,#68d4d033,transparent 70%),#1a1b1d;display:grid;place-items:center}
.mitem .cov img{width:100%;height:100%;object-fit:cover}
.mitem .cov b{font:800 30px var(--f-display);color:#ffffff22}
.mitem h4{font:600 16px var(--f-body);letter-spacing:0}

.trend{display:grid;grid-template-columns:44px 52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.trend .rk{font:700 22px var(--f-display);color:var(--peach)}
.trend img,.trend .ph0{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#1f2124}
.srcl{font:700 10px var(--f-body);letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.srcl.ed{color:var(--peach);border-color:#f4a98755}.srcl.li{color:var(--cyan);border-color:#68d4d055}.srcl.ch{color:var(--lav);border-color:#b7a1e555}
.radiocard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;align-items:center;background:radial-gradient(80% 120% at 0% 0%,#f4a98733,transparent 60%),radial-gradient(60% 90% at 100% 100%,#b7a1e530,transparent 60%),#151617;border:1px solid #ffffff14;border-radius:22px;padding:28px}
.radiocard h2{font-size:clamp(30px,4vw,48px)}
.msec{margin-top:54px}
.msec>h2{font:700 clamp(24px,3vw,34px) var(--f-display);margin-bottom:18px;letter-spacing:-.02em}

/* back office: website */
.mlib{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.mslot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.mslot .mth{aspect-ratio:16/10;background:#0c0d0e;position:relative;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px}
.mslot .mth img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mslot .mb{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.mslot .mb b{font-size:14.5px}
.mslot .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.focus-frame{position:relative;width:100%;border-radius:12px;overflow:hidden;background:#0c0d0e;cursor:crosshair;max-height:340px}
.focus-frame img{width:100%;height:100%;object-fit:cover;display:block}
.focus-dot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #000,0 0 12px #000;pointer-events:none}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lrow .th{width:46px;height:46px;border-radius:8px;object-fit:cover;background:#0c0d0e}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
@media (max-width:900px){
  .vinesec .wrap,.culture .wrap,.split,.radiocard{grid-template-columns:1fr}
  .split .ph{order:-1}
  .cards{grid-auto-columns:minmax(230px,62%)}
  footer.ft .wrap{display:block}
footer.ft .fgrid{grid-template-columns:1fr 1fr}
  .hh .bgimg{inset:0}
  .hh .bgimg::after{background:linear-gradient(0deg,#0d0d0e 6%,#0d0d0ecc 45%,#0d0d0e55 100%)}
  .hh{align-items:flex-end}
}
@media (max-width:560px){
  .vinelist{display:flex}
  .evx{grid-template-columns:70px minmax(0,1fr);row-gap:4px}
  .evx .th{display:none}.evx .w{grid-column:2;text-align:left}
  .intro .itop{grid-template-columns:1fr auto}.intro .itop .c{display:none}
  .pcards{grid-auto-columns:minmax(200px,72%)}
  #radio .meta{max-width:120px}
  .hh .loc{display:none}
  .nav .wrap{position:relative}
  .nav .soundbtn{position:absolute;right:12px;top:16px}
  .nav .soundbtn .lbl{display:none}
}
@media (max-width:900px){
  .hero .wrap,.cta,.bcols,.cols2{grid-template-columns:1fr}
  .branches{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  .branches{grid-template-columns:1fr}
  .links{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}
  .links a{white-space:nowrap}
  .ev{grid-template-columns:56px minmax(0,1fr)}
  .ev .act{grid-column:1/-1}
  section{padding-block:40px}
  .cta{padding:24px}
  .hqband .btn{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const REPEATS=[["","Does not repeat"],["daily","Every day"],["weekly","Every week"],["biweekly","Every 2 weeks"],["monthly","Every month (same date)"],["monthlyNth","Every month (same weekday)"],["yearly","Every year"]];

  }
  else if(e.repeat==="monthly"){const day=start.getDate();for(let k=0;;k++){const y=start.getFullYear(),m=start.getMonth()+k,dim=new Date(y,m+1,0).getDate();if(dim<day){if(iso(new Date(y,m,1))>to||++guard>5000)break;continue}const ds=iso(new Date(y,m,day));if(done(ds))break;push(ds)}}

    for(let k=0;;k++){const y=start.getFullYear(),m=start.getMonth()+k;let d;
      if(ni.last){d=new Date(y,m+1,0);while(d.getDay()!==ni.wd)d.setDate(d.getDate()-1)}
      else{d=new Date(y,m,1);while(d.getDay()!==ni.wd)d.setDate(d.getDate()+1);d.setDate(d.getDate()+7*(ni.n-1));if(d.getMonth()!==new Date(y,m,1).getMonth()){if(iso(new Date(y,m,1))>to||++guard>5000)break;continue}}
      const ds=iso(d);if(done(ds))break;push(ds)}}
  else if(e.repeat==="yearly"){for(let k=0;k<200;k++){const d=new Date(start.getFullYear()+k,start.getMonth(),start.getDate());if(d.getMonth()!==start.getMonth())continue;const ds=iso(d);if(done(ds))break;push(ds)}}

  else if(e.repeat==="weekly"||e.repeat==="biweekly"){r+="WEEKLY"+(e.repeat==="biweekly"?";INTERVAL=2":"")+";BYDAY="+((e.days&&e.days.length)?e.days:[parse(e.date).getDay()]).map(x=>BD[x]).join(",")}

}

function calItems(team,from,to){
  const items=[];from=from||addDays(today(),-400);to=to||addDays(today(),400);
  if(!team){expand(pub().events,from,to).forEach(e=>items.push({kind:"event",date:e.date,title:e.title,brand:e.brand,start:e.start,id:e.id,vis:"public",rep:!!e.repeat}));return items}
  expand(S.events,from,to).forEach(e=>items.push({kind:"event",date:e.date,title:e.title,brand:e.brand,start:e.start,id:e.id,vis:e.visibility,rep:!!e.repeat}));
  S.reminders.filter(r=>!r.done).forEach(r=>items.push({kind:"reminder",date:r.date,title:r.title,brand:r.brand,start:r.time,id:r.id}));
  ledgerAll().filter(l=>l.type==="meeting").forEach(l=>items.push({kind:"meeting",date:l.date,title:l.title||"Meeting",brand:l.brand,start:l.start,id:l.id}));
  return items;
}
function viewCalendar(team){
  const [y,m]=S.cal.month.split("-").map(Number);
  const first=new Date(y,m-1,1), days=new Date(y,m,0).getDate(), off=first.getDay();
  const cells=Math.ceil((off+days)/7)*7;
  const gFrom=iso(new Date(y,m-1,1-off)),gTo=iso(new Date(y,m-1,cells-off));
  const all=calItems(team,gFrom,gTo).filter(i=>S.cal.brand==="all"||i.brand===S.cal.brand);
  const byDay={};all.forEach(i=>{(byDay[i.date]=byDay[i.date]||[]).push(i)});
  Object.values(byDay).forEach(a=>a.sort((p,q)=>(p.start||"99")<(q.start||"99")?-1:1));
  const t=today();
  let g=DOW.map(d=>'<div class="dow">'+d+'</div>').join("");
  for(let c=0;c<cells;c++){

function monthStats(brand,month){
  const L=ledgerAll().filter(l=>(!brand||l.brand===brand)&&String(l.date).startsWith(month));
  const h=L.filter(l=>l.type==="meeting"||l.type==="hours").reduce((a,l)=>a+(Number(l.hours)||0),0);
  const sp=L.filter(l=>l.type==="expense"||l.type==="receipt").reduce((a,l)=>a+(Number(l.amount)||0),0);
  const inc=L.filter(l=>l.type==="income").reduce((a,l)=>a+(Number(l.amount)||0),0);
  const ev=expand(S.events.filter(e=>!brand||e.brand===brand),month+"-01",month+"-31").length;
  const pay=L.filter(l=>l.type==="income"&&(l.source||"Payment")==="Payment").reduce((a,l)=>a+(Number(l.amount)||0),0);
  const don=L.filter(l=>l.type==="income"&&l.source==="Donation").reduce((a,l)=>a+(Number(l.amount)||0),0);
  return {h,sp,inc,ev,pay,don,other:inc-pay-don,n:L.length};
}
function remindersDue(days){
  const t=today(), lim=addDays(t,days);
  const r=S.reminders.filter(x=>!x.done&&x.date<=lim).map(x=>Object.assign({kind:"rem"},x));
  expand(S.events,t,addDays(lim,15)).forEach(e=>{if(e.remindDays===""||e.remindDays==null)return;const from=addDays(e.date,-Number(e.remindDays));
    if(e.date>=t&&from<=lim)r.push({kind:"event",id:e.id,title:e.title,brand:e.brand,date:e.date,time:e.start,from})});
  return sortBy(r,x=>x.date+(x.time||""));
}
function remRow(r,showCheck){
  const t=today(), over=r.date<t&&!r.done;
  return '<div class="rem'+(r.done?" done":"")+'" style="'+cvar(r.brand)+'">'+
    (r.kind==="event"?'<span class="pill pub" style="margin-top:2px">Event</span>':'<input type="checkbox" data-act="toggle-rem" data-id="'+esc(r.id)+'" aria-label="Mark done"'+(r.done?" checked":"")+'>')+
    '<div style="min-width:0"><div class="rt">'+esc(r.title)+'</div><div class="rm">'+chip(r.brand)+'<span class="mono">'+fmtDate(r.date)+(r.time?" · "+fmtTime(r.time):"")+'</span>'+
    (over?'<span class="pill over">Overdue</span>':'')+(r.priority==="high"?'<span class="pill high">Important</span>':'')+
    (r.notes?'<span>'+esc(r.notes)+'</span>':'')+'</div></div>'+
    '<button class="rowbtn" data-act="'+(r.kind==="event"?"edit-event":"edit-rem")+'" data-id="'+esc(r.id)+'">Edit</button></div>';
}

/* ---------- private notes (encrypted in the browser) ---------- */
const u8b64=u=>{let s="";u.forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const b64u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function vDerive(pass,salt){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function vEnc(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj)));return {iv:u8b64(iv),ct:u8b64(new Uint8Array(ct))}}
async function vDec(key,row){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64u8(row.iv)},key,b64u8(row.ct));return JSON.parse(new TextDecoder().decode(pt))}
async function decryptVault(){const out={};for(const r of S.vault){try{out[r.id]=await vDec(S.vkey,r)}catch(e){out[r.id]={title:"(couldn't unlock this note)"}}}S.vplain=out;scheduleRender(true)}
let vTimer;
function viewVault(){
  if(!window.crypto||!crypto.subtle)return '<div class="empty">Private notes need a secure browser connection (https).</div>';
  if(!S.loaded.vault)return '<div class="empty">Loading…</div>';
  const lockIcon='<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--olive)" stroke-width="2" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
  if(!S.vaultMeta)return '<div class="card gate" style="margin:0 auto">'+lockIcon+'<h2 style="font-size:26px">Set up your private notes</h2><p class="muted">A place for passwords, log ins and account details. Everything is locked with a passphrase that only you know. It is encrypted in your browser before it is saved, so not even the database can read it.</p><p class="muted" style="font-size:13.5px">During setup you\'ll add your recovery emails and phone number. You\'ll get a recovery code to send to them, so you can reset the passphrase if you forget it.</p><button class="btn olive" data-act="vault-setup">Set up private notes</button></div>';

/* v2: a random data key encrypts the notes. That key is stored twice, once locked by the passphrase
   and once locked by a one-time recovery code that is sent to the founder's email and phone. */
const RC_ALPH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function newRecoveryCode(){const r=crypto.getRandomValues(new Uint8Array(24));let s="";r.forEach((b,i)=>{s+=RC_ALPH[b%32];if(i%4===3&&i<23)s+="-"});return s}
const normRC=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const importDK=raw=>crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},true,["encrypt","decrypt"]);
async function wrapRaw(secret,salt,raw){const k=await vDerive(secret,salt);const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,raw);return {iv:u8b64(iv),ct:u8b64(new Uint8Array(ct))}}
async function unwrapRaw(secret,saltB64,w){const k=await vDerive(secret,b64u8(saltB64));return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64u8(w.iv)},k,b64u8(w.ct)))}
const maskEmail=e=>{const [u,d]=String(e).split("@");return d?(u.slice(0,1)+"•••@"+d):e};
const maskPhone=p=>{const d=String(p).replace(/\D/g,"");return d.length>=4?"•••-•••-"+d.slice(-4):p};
const contactsOf=()=>((S.vaultMeta&&S.vaultMeta.contacts)||{emails:[],phone:""});
async function unlockWith(raw){S.vraw=raw;S.vkey=await importDK(raw);vTouch();await decryptVault();render()}
function lockVault(){S.vkey=null;S.vraw=null;S.vplain={}}
function vTouch(){clearTimeout(vTimer);vTimer=setTimeout(()=>{lockVault();if(S.route==="team-vault")render()},20*60*1000)}

/* ---------- documents (receipts, PDFs) stored in pieces ---------- */
const DOC_CATS=["Receipt","Invoice","Contract","Tax form","Bank statement","Permit or license","Photo","Other"];
const DOC_MAX=10*1024*1024, CHUNK=180000;
const fmtSize=n=>n>=1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function putChunk(id,i,data){for(let t=0;t<4;t++){try{await S.db.collection("docchunks").doc(id+"_"+i).set({data});return true}catch(e){if(e&&e.code==="quota_exceeded")throw e;await sleep(600*(t+1))}}return false}
function readB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=rej;r.readAsDataURL(file)})}
function docsModal(files){
  openModal('<form id="mf"><h3 style="margin-bottom:12px">Upload documents</h3><div style="display:flex;flex-direction:column;gap:12px">'+
    '<label class="f">Files (PDF, photos, spreadsheets… up to 10 MB each)<input class="i" type="file" id="d-files" multiple accept=".pdf,image/*,.doc,.docx,.xls,.xlsx,.csv,.txt"></label>'+
    '<div class="grid2"><label class="f">Company<select class="i" id="d-brand" name="brand">'+brandOpts(S.docf.brand!=="all"?S.docf.brand:"hq")+'</select></label><label class="f">Type<select class="i" id="d-cat" name="category">'+DOC_CATS.map(c=>'<option>'+c+'</option>').join("")+'</select></label><label class="f">Date<input class="i" type="date" id="d-date" name="date" value="'+today()+'"></label></div>'+

  el=>{
    const fi=el.querySelector("#d-files");
    if(files&&files.length){try{const dt=new DataTransfer();[...files].forEach(f=>dt.items.add(f));fi.files=dt.files}catch(e){}}
    el.querySelector("#mf").addEventListener("submit",async ev=>{ev.preventDefault();const o=formObj(ev.target),msg=el.querySelector("#d-msg"),btn=ev.target.querySelector("button[type=submit]");
      const list=[...fi.files];if(!list.length){msg.textContent="Choose at least one file.";return}
      const big=list.find(f=>f.size>DOC_MAX);if(big){msg.style.color="var(--bad)";msg.textContent=big.name+" is larger than 10 MB. Compress it or split it, then try again.";return}
      btn.disabled=true;msg.style.color="var(--muted)";let done=0;

const PDFJS_BASE="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";

function loadPdfJs(){
  if(window.__pdfjsOverride)return window.__pdfjsOverride();

/* PDF → lines of text, top to bottom, left to right */
async function pdfLines(file){
  const L=await loadPdfJs();const buf=new Uint8Array(await file.arrayBuffer());
  const doc=await L.getDocument({data:buf}).promise;const out=[];
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p);const tc=await page.getTextContent();const rowsY=[];
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const x=it.transform[4],y=it.transform[5];let r=rowsY.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,items:[]};rowsY.push(r)}r.items.push({x,s:it.str,w:it.width||0})});
    rowsY.sort((a,b)=>b.y-a.y).forEach(r=>{r.items.sort((a,b)=>a.x-b.x);let line="",end=null;r.items.forEach(i=>{if(end!==null)line+=(i.x-end>12?"   ":" ");line+=i.s.trim();end=i.x+i.w});out.push(line.trim())});
  }
  return out;
}

/* ---- statement parsing ---- */
const MONTHS3={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
const DATE_AT_START=/^\s*(\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?|\d{4}-\d{2}-\d{2}|(?:jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?\s+\d{1,2}(?:,?\s+\d{4})?)\b/i;
const AMT_G=/\(?-?\s?\$?\s?\d{1,3}(?:,\d{3})*\.\d{2}\)?(?:\s?(?:CR|DR)\b|-(?=\s|$))?/gi;
function toISO(raw,yearHint,endMonth){
  raw=raw.trim().replace(/\./g,"/");let y,m,d,mm;
  if((mm=/^(\d{4})-(\d{2})-(\d{2})$/.exec(raw))){y=+mm[1];m=+mm[2];d=+mm[3]}
  else if((mm=/^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?$/.exec(raw))){m=+mm[1];d=+mm[2];y=mm[3]?(+mm[3]<100?2000+(+mm[3]):+mm[3]):null}
  else if((mm=/^([a-z]+)\/?\s+(\d{1,2})(?:,?\s+(\d{4}))?$/i.exec(raw))){m=MONTHS3[mm[1].slice(0,4).toLowerCase()]||MONTHS3[mm[1].slice(0,3).toLowerCase()];d=+mm[2];y=mm[3]?+mm[3]:null}
  if(!m||!d||m>12||d>31)return null;
  if(!y){y=yearHint;if(endMonth&&m>endMonth+1)y=yearHint-1}
  return y+"-"+pad(m)+"-"+pad(d);
}
function amtVal(s){const neg=/^\(|\)$|^-|-\s*$|\bDR\b/i.test(s.trim())||/-\s?\$/.test(s);const v=parseFloat(s.replace(/[^\d.]/g,""));return isNaN(v)?null:(neg?-v:v)}
const IN_WORDS=/\b(deposit|credit|transfer from|payout|refund|received|incoming|zelle from|cash app from|venmo from|interest paid|reversal|ach credit|direct dep|mobile deposit)\b/i;
const OUT_WORDS=/\b(purchase|debit|withdrawal|payment to|pos\b|card \d{4}|ach debit|fee|charge|transfer to|zelle to|bill pay|atm|check\s?#?\d+|subscription|autopay)\b/i;
const PLATFORMS=[["stripe","Stripe"],["shopify","Shopify"],["paypal","PayPal"],["square","Square"],["cash app","Cash App"],["cashapp","Cash App"],["venmo","Venmo"],["zelle","Zelle"],["patreon","Patreon"],["gofundme","GoFundMe"],["givebutter","Givebutter"],["kdp","Amazon KDP"],["amazon","Amazon"],["youtube","YouTube"],["google","Google"],["tiktok","TikTok"],["eventbrite","Eventbrite"],["etsy","Etsy"],["ebay","eBay"],["distrokid","DistroKid"],["spotify","Spotify"],["apple","Apple"],["netlify","Netlify"],["squarespace","Squarespace"],["adobe","Adobe"],["canva","Canva"],["uber","Uber"],["lyft","Lyft"]];
const DONATION_RE=/\b(donat|gofundme|patreon|givebutter|tip(s|ping)?\b|sponsor|gift)/i;
const CAT_RULES=[[/\b(uber|lyft|delta|united|american air|southwest|airbnb|hotel|marriott|hilton|parking|shell|exxon|chevron|bp\b|gas)\b/i,"Travel"],[/\b(adobe|google|squarespace|netlify|canva|openai|anthropic|github|microsoft|apple\.com|dropbox|zoom|notion|figma|firebase)\b/i,"Software"],[/\b(meta|facebook|instagram|tiktok ads|ads\b|promo|printing|vistaprint)\b/i,"Marketing"],[/\b(fee|service charge|overdraft|interest charge)\b/i,"Fees"],[/\b(restaurant|cafe|coffee|starbucks|doordash|grubhub|uber eats|chipotle|mcdonald)\b/i,"Food & drink"],[/\b(guitar center|sweetwater|b&h|best buy|amazon)\b/i,"Equipment"],[/\b(payroll|gusto|adp)\b/i,"Payroll"]];
const DEFAULT_RULES=[{k:"vybr8",b:"vybr8"},{k:"pathd",b:"pathd"},{k:"w4w",b:"w4w"},{k:"drawup",b:"aec"},{k:"shadow crown",b:"scu"},{k:"kdp",b:"scu"},{k:"whatiftmw",b:"wit"},{k:"what if tomorrow",b:"wit"},{k:"grooveville music",b:"music"},{k:"distrokid",b:"music"},{k:"grooveville ent",b:"ent"},{k:"eventbrite",b:"ent"},{k:"grooveville rentals",b:"rentals"}];
const convRules=()=>((S.convRules&&S.convRules.rules)||DEFAULT_RULES);
function matchBrand(text){const t=" "+String(text).toLowerCase()+" ";const r=convRules().find(r=>r.k&&t.includes(String(r.k).toLowerCase()));return r?{brand:r.b,rule:r.k,source:r.src||""}:null}
function platformOf(text){const t=String(text).toLowerCase();const p=PLATFORMS.find(([k])=>t.includes(k));return p?p[1]:""}
function cleanDesc(s){return String(s).replace(/\s{2,}/g," ").replace(/\b(pos|ach|ppd|ccd|web|id:?\s*\w+|card\s*\d{4}|xx+\d+)\b/gi," ").replace(/\s{2,}/g," ").trim().slice(0,90)}
function finishRow(r){
  const m=matchBrand(r.desc);const plat=platformOf(r.desc);
  r.brand=m?m.brand:"hq";r.matched=!!m;r.platform=plat;
  r.type=r.amount>=0?"income":"expense";
  r.source=r.type==="income"?((m&&m.source)||(DONATION_RE.test(r.desc)?"Donation":"Payment")):"";
  r.category=r.type==="expense"?((CAT_RULES.find(([re])=>re.test(r.desc))||[])[1]||"Other"):"";
  r.title=cleanDesc(r.desc)||"Bank transaction";
  r.fp=r.date+"|"+r.amount.toFixed(2)+"|"+r.title.toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,24);
  r.dup=ledgerAll().some(l=>l.fp===r.fp);r.include=!r.dup;r.id=r.id||uid();
  return r;
}
function parseStatementLines(lines){
  const text=lines.join("\n");
  const years=(text.match(/\b20\d{2}\b/g)||[]).map(Number).filter(y=>y>=2015&&y<=2100);
  const per=/(?:statement period|period|for)\b[^\n]*?(\d{1,2}[\/\-]\d{1,2}[\/\-](\d{2,4}))\s*(?:-|to|through|–)\s*(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/i.exec(text);
  let yearHint=years.length?Math.max(...years):new Date().getFullYear(),endMonth=0;
  if(per){yearHint=+per[5]<100?2000+(+per[5]):+per[5];endMonth=+per[3]}
  const rows=[],skipped=[];let section=0,prevBal=null,last=null;
  lines.forEach(line=>{
    const L=line.trim();if(!L)return;
    const dm=DATE_AT_START.exec(L);const amts=(L.match(AMT_G)||[]).map(s=>s.trim());
    if(!dm){
      if(!amts.length&&/(deposits|credits|additions|money in|incoming)/i.test(L)){section=1;last=null;return}
      if(!amts.length&&/(withdrawals|debits|subtractions|checks paid|purchases|payments|fees|money out|outgoing|card transactions)/i.test(L)){section=-1;last=null;return}
      if(/(beginning|opening|previous) balance/i.test(L)&&amts.length)prevBal=amtVal(amts[amts.length-1]);
      else if(last&&!amts.length&&L.length<70&&!/page \d|continued|balance|total|summary|account|statement/i.test(L)){last.desc+=" "+L;}
      else if(amts.length)skipped.push(L);
      return;
    }
    if(!amts.length){skipped.push(L);return}
    const date=toISO(dm[1],yearHint,endMonth);
    let desc=L.slice(dm[0].length);amts.forEach(a=>{desc=desc.replace(a,"")});desc=desc.replace(/\s{2,}/g," ").trim();
    if(/(beginning|ending|opening|closing|daily|available)\s+balance|^total|balance forward/i.test(desc)){prevBal=amtVal(amts[amts.length-1]);last=null;return}
    if(!date){skipped.push(L);return}
    let raw=amts[0],val=amtVal(raw),bal=amts.length>=2?amtVal(amts[amts.length-1]):null;
    if(val===null){skipped.push(L);return}
    const explicit=/^\(|\)$|^-|-$|\bDR\b|\bCR\b/i.test(raw);
    let sign=0;
    if(explicit)sign=/\bCR\b/i.test(raw)?1:(val<0?-1:1);
    else if(prevBal!==null&&bal!==null&&Math.abs(Math.abs(bal-prevBal)-Math.abs(val))<0.011)sign=bal>=prevBal?1:-1;
    else if(section)sign=section;
    else if(IN_WORDS.test(desc))sign=1;
    else if(OUT_WORDS.test(desc))sign=-1;

    if(bal!==null)prevBal=bal;
    const r={date,desc,amount:Math.abs(val)*sign,raw:L,how:explicit?"sign":(sign&&section?"section":"words")};

}
function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"')q=true;else if(c===","){row.push(cell);cell=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}else cell+=c}
  if(cell||row.length){row.push(cell);rows.push(row)}
  const hi=rows.findIndex(r=>r.some(c=>/date/i.test(c))&&r.some(c=>/amount|debit|credit|withdraw|deposit/i.test(c)));
  if(hi<0)return null;
  const H=rows[hi].map(h=>h.trim().toLowerCase());const col=re=>H.findIndex(h=>re.test(h));
  const cD=col(/date/),cDesc=col(/desc|memo|payee|name|details|transaction/),cA=col(/^amount|amount$/),cDr=col(/debit|withdraw|money out/),cCr=col(/credit|deposit|money in/);
  const out=[];
  rows.slice(hi+1).forEach(r=>{if(!r[cD])return;const date=toISO(r[cD].trim().split(" ")[0],new Date().getFullYear());if(!date)return;
    let a=null;if(cA>=0&&r[cA])a=amtVal(r[cA]);else{const dr=cDr>=0?amtVal(r[cDr]||""):null,cr=cCr>=0?amtVal(r[cCr]||""):null;if(cr)a=Math.abs(cr);else if(dr)a=-Math.abs(dr)}
    if(a===null||a===0)return;out.push({date,desc:(r[cDesc]||"").trim(),amount:a,raw:r.join(", "),how:"csv"})});
  return {rows:out.map(finishRow),skipped:[],period:""};
}

/* ---- events & emails ---- */
function findDate(text,noRoll){
  const t=String(text);let m;
  if((m=/\b(\d{4}-\d{2}-\d{2})\b/.exec(t)))return m[1];
  if((m=/\b(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/.exec(t)))return toISO(m[0],new Date().getFullYear());
  if((m=/\b(?:(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*,?\s+)?((?:jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?\s+\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(\d{4}))?/i.exec(t))){
    const y=m[2]?+m[2]:new Date().getFullYear();let iso=toISO(m[1].replace(/\./,"")+" "+y,y);if(iso&&!m[2]&&!noRoll&&iso<today())iso=(y+1)+iso.slice(4);return iso}
  if((m=/\b(\d{1,2})\/(\d{1,2})\b/.exec(t))){let iso=toISO(m[0],new Date().getFullYear());if(iso&&!noRoll&&iso<today())iso=(+iso.slice(0,4)+1)+iso.slice(4);return iso}
  return "";
}
function findTimes(text){
  const rngFirst=/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|to)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i.exec(text);
  if(rngFirst){const ap1=rngFirst[3]||rngFirst[6];let s=+rngFirst[1]%12;if(/p/i.test(ap1))s+=12;let e=+rngFirst[4]%12;if(/p/i.test(rngFirst[6]))e+=12;return [pad(s)+":"+(rngFirst[2]||"00"),pad(e)+":"+(rngFirst[5]||"00")]}
  const re=/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)/gi;const out=[];let m;
  while((m=re.exec(text))&&out.length<2){let h=+m[1]%12;if(/p/i.test(m[3]))h+=12;out.push(pad(h)+":"+(m[2]||"00"))}
  const rng=/\b(\d{1,2})(?::(\d{2}))?\s*[-–to]+\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i.exec(text);
  if(rng&&out.length<2){let e=+rng[3]%12;if(/p/i.test(rng[5]))e+=12;let s=+rng[1]%12;if(/p/i.test(rng[5])&&s+12<=e)s+=12;return [pad(s)+":"+(rng[2]||"00"),pad(e)+":"+(rng[4]||"00")]}
  return out;
}
function headerVal(text,name){const m=new RegExp("^"+name+":\\s*(.+)$","im").exec(text);return m?m[1].trim():""}
function readEvent(text){
  const lines=String(text).split(/\n/).map(s=>s.trim()).filter(Boolean);
  const subj=headerVal(text,"subject");const title=(subj||lines.find(l=>!/^(from|to|date|sent|subject|cc):/i.test(l))||"New event").replace(/^(re|fwd?):\s*/i,"").slice(0,90);
  const tm=findTimes(text);const loc=(/\b(?:at|location|venue|where)\s*[:\-]?\s+([A-Z0-9][^\n.,]{3,60})/.exec(text)||[])[1]||"";
  const link=(/(https?:\/\/[^\s)]+)/.exec(text)||[])[1]||"";const mb=matchBrand(text);
  const tl=String(text).toLowerCase();const dm=/every\s+(sun|mon|tue|wed|thu|fri|sat)/.exec(tl);
  const repeat=/every other week|bi-?weekly|every 2 weeks/.test(tl)?"biweekly":(dm||/\bweekly\b|every week/.test(tl))?"weekly":/\bdaily\b|every day/.test(tl)?"daily":/\bmonthly\b|every month/.test(tl)?"monthly":/\byearly\b|annual|every year/.test(tl)?"yearly":"";
  const days=dm?[["sun","mon","tue","wed","thu","fri","sat"].indexOf(dm[1])]:[];
  return {repeat,days,title,date:findDate(text)||today(),start:tm[0]||"",end:tm[1]||"",location:loc.trim(),link,brand:mb?mb.brand:"hq",visibility:"private",description:String(text).trim().slice(0,1500),toCal:true,toLog:true,toDoc:false};
}
const KINDS=["Complaint","Question","Collab request","Payment","Booking","Other"];
function readEmail(text){
  const from=headerVal(text,"from"),subject=headerVal(text,"subject"),dateH=headerVal(text,"date")||headerVal(text,"sent");
  const body=String(text).replace(/^(from|to|cc|date|sent|subject):.*$/gim,"").trim();
  const t=(subject+" "+body).toLowerCase();
  const kind=/(complain|refund|issue|problem|disappoint|broken|unhappy|wrong|never received|charged twice|not working|terrible|bad experience)/.test(t)?"Complaint":/(collab|partner|sponsor|feature|work together)/.test(t)?"Collab request":/(book|reserve|availability|rental|quote)/.test(t)?"Booking":/(invoice|payment|paid|receipt)/.test(t)?"Payment":/\?/.test(t)?"Question":"Other";
  const mb=matchBrand(text);const ev=findDate(body,true);
  return {from,subject:subject||body.split("\n")[0].slice(0,80)||"Message",date:findDate(dateH)||today(),kind,brand:mb?mb.brand:"hq",summary:body.slice(0,1500),followUp:addDays(today(),2),eventDate:ev&&ev>today()?ev:"",toLog:true,toRem:kind!=="Other",toCal:false,toCollab:kind==="Collab request",toDoc:false};
}

/* ---- storage helper shared with Documents ---- */
async function storeDocBlob(blob,name,meta){
  const b64=await readB64(blob),id=uid(),n=Math.max(1,Math.ceil(b64.length/CHUNK));
  for(let i=0;i<n;i++){if(!await putChunk(id,i,b64.slice(i*CHUNK,(i+1)*CHUNK)))throw {code:"chunk"}}
  if(!await save("docs",id,Object.assign({name,type:blob.type||"application/octet-stream",size:blob.size,chunks:n,brand:"hq",category:"Other",date:today(),notes:"",uploadedAt:new Date().toISOString()},meta)))throw {code:"meta"};
  return id;
}

/* ---- actions ---- */
function convReset(keepMode){S.conv={mode:keepMode||S.conv.mode||"stmt",saveDoc:true}}
async function convLoadStatement(file){
  const c=S.conv;c.err="";c.busy="Reading "+file.name+"…";c.rows=null;c.file=file;c.fileName=file.name;render();
  try{
    let res;
    if(/\.csv$/i.test(file.name)||file.type==="text/csv")res=parseCSV(await file.text());
    else{const lines=await pdfLines(file);res=parseStatementLines(lines);if(!res.rows.length&&lines.join("").length<40)c.err="This PDF has no readable text. It's probably a scanned image. Download the statement as a text PDF or CSV from your bank's website."}
    if(!res){c.err="Couldn't find date and amount columns in this CSV.";c.busy="";return render()}
    c.rows=res.rows;c.skipped=res.skipped;c.period=res.period;c.busy="";
  }catch(e){c.busy="";c.err="Couldn't open that file. Make sure it's a PDF or CSV statement."+(e&&e.message==="load"?" (The PDF reader didn't load; check your internet connection.)":"")}
  render();
}
async function convPost(btn){
  const c=S.conv;const inc=c.rows.filter(r=>r.include);if(!inc.length)return;
  btn.disabled=true;btn.textContent="Adding…";let docId="";
  try{
    if(c.saveDoc!==false&&c.file)docId=await storeDocBlob(c.file,c.fileName,{brand:"hq",category:"Bank statement",date:(inc[inc.length-1]||{}).date||today(),notes:"Converted: "+inc.length+" transactions"});
    else if(c.saveDoc!==false&&c.pasted)docId=await storeDocBlob(new Blob([c.pasted],{type:"text/plain"}),"Pasted statement "+today()+".txt",{brand:"hq",category:"Bank statement",notes:"Converted: "+inc.length+" transactions"});
    let n=0;
    for(const r of inc){
      const rec={brand:r.brand,type:r.amount>=0?"income":"expense",date:r.date,title:r.title,amount:Math.round(Math.abs(r.amount)*100)/100,vendor:r.platform||r.title,category:r.amount>=0?"":r.category,notes:"From bank statement"+(c.fileName?" · "+c.fileName:""),fp:r.fp,fromStatement:docId,createdAt:new Date().toISOString(),by:S.uid||""};
      if(r.amount>=0)rec.source=r.source||"Payment";else{rec.payment="Business card";rec.receiptNo=""}
      if(await save("ledger",uid(),rec))n++;
    }
    await save("conversions",uid(),{kind:"Bank statement",title:c.fileName||"Pasted statement",brands:[...new Set(inc.map(r=>r.brand))],items:n,docId,at:new Date().toISOString()});
    toast(n+" transactions added"+(docId?" · statement saved to Documents":""));convReset("stmt");render();
  }catch(e){btn.disabled=false;btn.textContent="Try again";toast("Stopped partway. Check your connection; already-added rows show as “Already logged”.")}
}

    ctx.globalCompositeOperation="lighter";ctx.lineCap="round";
    for(let k=0;k<5;k++){const rr=disc*(0.6+k*0.28),rot=now/(380-k*40)*(k%2?1:-1);ctx.strokeStyle="hsla("+(270+k*9)+",95%,"+(62+k*3)+"%,"+(0.32-k*0.04)+")";ctx.lineWidth=(6-k)*dpr;ctx.beginPath();ctx.arc(cx,cy,rr,rot,rot+Math.PI*1.3);ctx.stroke()}

  }catch(err){finish()}};

}

/* ---------- Grooveville Radio (Spotify embed or a licensed stream) ---------- */
const RD={open:false,playing:false,ctrl:null,audio:null,key:"",wantPlay:false,apiLoading:false};
function spotifyUri(u){const x=/open\.spotify\.com\/(?:intl-[a-z-]+\/)?(playlist|album|track|artist|show|episode)\/([A-Za-z0-9]+)/.exec(u||"")||/spotify:(playlist|album|track|artist|show|episode):([A-Za-z0-9]+)/.exec(u||"");return x?"spotify:"+x[1]+":"+x[2]:""}
function radioSrc(){const m=siteCfg("music");const sp=spotifyUri(m.spotify);if(sp)return {kind:"spotify",uri:sp,name:m.station,attr:"Playback and audio by Spotify. Some listeners hear previews unless signed in to Spotify."};if(/^https:\/\//.test(m.stream||""))return {kind:"stream",url:m.stream,name:m.station,attr:m.streamAttr||"Grooveville-licensed stream"};return null}
function renderRadio(){
  const el=$("#radio");if(!el)return;const src=radioSrc();
  if(!src||S.route.startsWith("team")&&!RD.playing){if(!src&&RD.key){radioStop()}if(!src){el.innerHTML="";RD.key="";return}}
  const key=src.kind+"|"+(src.uri||src.url);
  if(RD.key!==key){radioStop();RD.key=key;RD.open=false;const art=slotSrc("radio-art")||LOGO;
    el.innerHTML='<div class="panel" id="rdPanel" hidden><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><b style="flex:1">'+esc(src.name)+'</b><button class="ic" data-act="radio-close" aria-label="Collapse player">⌄</button></div><div class="emb" id="rdEmbed">'+(src.kind==="spotify"?'<div id="rdHost"></div>':'<div style="padding:12px;display:flex;flex-direction:column;gap:8px"><label class="f" style="color:#cfc9bf">Volume<input type="range" min="0" max="1" step=".05" value=".8" id="rdVol" aria-label="Volume"></label></div>')+'</div><small class="attr">'+esc(src.attr)+'</small></div>'+
      '<div class="pill0"><button class="pp" data-act="radio-toggle" aria-label="Play Grooveville Radio">▶</button><img class="art0" src="'+esc(art)+'" alt=""><div class="meta"><b>'+esc(src.name)+'</b><small>'+(src.kind==="spotify"?"Spotify playlist":"Live stream")+'</small></div><button class="ic" data-act="radio-expand" aria-label="Expand player" aria-expanded="false">⌃</button></div>';
    const vol=$("#rdVol");if(vol)vol.addEventListener("input",()=>{if(RD.audio)RD.audio.volume=Number(vol.value)});
  }
  syncRadio();
}
function syncRadio(){const b=$("#radio .pp");if(b){b.textContent=RD.playing?"❚❚":"▶";b.setAttribute("aria-label",RD.playing?"Pause Grooveville Radio":"Play Grooveville Radio")}
  const p=$("#rdPanel");if(p)p.hidden=!RD.open;const x=$("#radio [data-act=radio-expand]");if(x){x.setAttribute("aria-expanded",RD.open?"true":"false");x.textContent=RD.open?"⌄":"⌃"}
  document.querySelectorAll("[data-act=radio-play]").forEach(btn=>{btn.textContent=RD.playing?"❚❚ Pause radio":"▶ Play radio"})}
function spotifyInit(){
  const src=radioSrc();if(!src||src.kind!=="spotify"||RD.ctrl)return;
  const go=api=>{const host=$("#rdHost");if(!host)return;api.createController(host,{uri:src.uri,width:"100%",height:152},c=>{RD.ctrl=c;c.addListener("playback_update",e=>{RD.playing=!(e.data&&e.data.isPaused);syncRadio()});c.addListener("ready",()=>{if(RD.wantPlay){RD.wantPlay=false;try{c.play()}catch(e){}}})})};
  if(window.__spApi)return go(window.__spApi);
  window.onSpotifyIframeApiReady=api=>{window.__spApi=api;go(api)};
  if(!RD.apiLoading){RD.apiLoading=true;const s=document.createElement("script");s.src="https://open.spotify.com/embed/iframe-api/v1";s.async=true;s.onerror=()=>{const h=$("#rdEmbed");if(h)h.innerHTML='<iframe title="Grooveville Radio on Spotify" style="border:0;width:100%;height:152px" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" src="https://open.spotify.com/embed/'+src.uri.split(":").slice(1).join("/")+'"></iframe>'};document.head.appendChild(s)}
}
function radioPlay(){const src=radioSrc();if(!src)return;renderRadio();
  if(src.kind==="spotify"){RD.open=true;syncRadio();if(RD.ctrl){try{RD.ctrl.play()}catch(e){RD.ctrl.togglePlay()}}else{RD.wantPlay=true;spotifyInit()}return}
  if(!RD.audio){RD.audio=new Audio(src.url);RD.audio.preload="none";RD.audio.addEventListener("play",()=>{RD.playing=true;syncRadio()});RD.audio.addEventListener("pause",()=>{RD.playing=false;syncRadio()});RD.audio.addEventListener("error",()=>toast("The radio stream couldn't be reached"))}
  const v=$("#rdVol");if(v)RD.audio.volume=Number(v.value);RD.audio.play().catch(()=>toast("Press play again to start the radio"))}
function radioPause(){if(RD.ctrl){try{RD.ctrl.pause()}catch(e){}}if(RD.audio)RD.audio.pause();RD.playing=false;syncRadio()}
function radioStop(){radioPause();if(RD.ctrl){try{RD.ctrl.destroy()}catch(e){}}RD.ctrl=null;RD.audio=null}
function radioToggle(){if(RD.playing){radioPause();if(S.sound){S.sound=false;syncSoundBtns()}}else{radioPlay();if(!S.sound){S.sound=true;syncSoundBtns()}}}

let vtipFor=null;
function hideVtip(){const t=$(".vtip");if(t)t.remove();vtipFor=null}
function showVtip(node,x,y){
  const id=node.dataset.vine,b=brandInfo(id);if(vtipFor===id&&$(".vtip"))return;hideVtip();vtipFor=id;
  const t=document.createElement("div");t.className="vtip";t.setAttribute("role","tooltip");t.style.cssText=cvar(id);
  t.innerHTML='<small>'+esc(b.cat||b.role)+'</small><b>'+esc(b.name)+'</b><p>'+esc(b.tagline)+'</p><a href="#b-'+id+'">Explore '+esc(b.short==="AELIO"?"AELIO":b.name.replace(/^Grooveville /,""))+' →</a>';
  document.body.appendChild(t);const r=t.getBoundingClientRect();
  t.style.left=Math.max(8,Math.min(innerWidth-r.width-8,x-r.width/2))+"px";t.style.top=Math.max(8,(y-r.height-18<8?y+22:y-r.height-18))+"px";
}
function wireHome(){
  const svg=$("#app svg.tree");if(svg&&!svg._w){svg._w=1;
    svg.addEventListener("pointerover",e=>{const n=e.target.closest(".node[data-vine]");if(n&&e.pointerType==="mouse")showVtip(n,e.clientX,e.clientY)});
    svg.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse")setTimeout(()=>{if(!document.querySelector(".vtip:hover"))hideVtip()},250)});
    svg.addEventListener("focusin",e=>{const n=e.target.closest(".node[data-vine]");if(n){const r=n.getBoundingClientRect();showVtip(n,r.left+r.width/2,r.top)}});
    svg.addEventListener("click",e=>{const n=e.target.closest(".node[data-vine]");if(!n)return;if(matchMedia("(hover: none)").matches&&vtipFor!==n.dataset.vine){e.preventDefault();const r=n.getBoundingClientRect();showVtip(n,r.left+r.width/2,r.top)}});
  }
  const c=$("#galCards");if(c&&!c._w){c._w=1;c.addEventListener("scroll",()=>{const w=(c.firstElementChild||{}).offsetWidth||1;const i=Math.round(c.scrollLeft/(w+16));const n=$("#galN");if(n)n.textContent=pad(Math.min(i+1,c.children.length))+" / "+pad(c.children.length)},{passive:true})}
}
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".vtip,.tree"))hideVtip()});
addEventListener("scroll",()=>{if(vtipFor&&matchMedia("(hover: hover)").matches)hideVtip()},{passive:true});

function slotList(){
  const L=[{id:"intro-poster",g:"Cinematic entry",label:"Entry poster image",r:"16/9",note:"Optional. Replaces the animated Charlotte drive with a still."},
    {id:"intro-video",g:"Cinematic entry",label:"Entry film",kind:"video",note:"Link to an MP4 or WebM you own or license. Plays muted; skipped on slow connections."},
    {id:"intro-audio",g:"Cinematic entry",label:"Entry sound",kind:"audio",note:"Optional audio link for SOUND ON. Without it a soft built-in tone plays."},
    {id:"home-hero",g:"Homepage",label:"Hero photo",r:"16/9"},{id:"home-collab",g:"Homepage",label:"Collaborate photo",r:"4/3"},{id:"home-story",g:"Homepage",label:"Our Story photo",r:"4/3"}];
  VENTURES().forEach(b=>L.push({id:"card-"+b.id,g:"Company cards & pages",label:brandInfo(b.id).name+" card",r:"4/5"}));
  L.push({id:"card-hq",g:"Company cards & pages",label:"Grooveville LLC (HQ) page",r:"16/9"},{id:"hero-ent",g:"Entertainment & Music",label:"Entertainment hero",r:"16/9"},{id:"radio-art",g:"Entertainment & Music",label:"Radio artwork",r:"1/1"});
  for(let i=1;i<=6;i++)L.push({id:"aelio-p"+i,g:"AELIO",label:pad(i)+" "+siteCfg("aelio").pers[i-1].n,r:"1/1"});
  upcomingEvents(S.events.filter(e=>e.visibility==="public")).slice(0,12).forEach(e=>{if(!L.some(x=>x.id==="ev-"+e.id))L.push({id:"ev-"+e.id,g:"Event images",label:e.title+" · "+fmtDate(e.date),r:"4/3"})});
  L.push({id:"vine-art",g:"Protected brand assets",label:"The Groove Vine",r:"1/1",prot:true,note:"The original illustrated vine is drawn in code and stays interactive. Only replace it on purpose."});
  return L;
}

async function saveSite(patch){return save("settings","site",Object.assign({brands:{}},S.site,patch))}
async function saveMusic(m){const cur=Object.assign({},(S.site||{}).music||{});return saveSite({music:Object.assign(cur,m)})}
function shrinkImage(file,maxW,maxChars){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;const k=Math.min(1,maxW/w);w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);
  let q=.86,out=c.toDataURL("image/webp",q);if(!/^data:image\/webp/.test(out))out=c.toDataURL("image/jpeg",q);while(out.length>maxChars&&q>.4){q-=.08;out=c.toDataURL(/webp/.test(out)?"image/webp":"image/jpeg",q)}
  if(out.length>maxChars){const c2=document.createElement("canvas");c2.width=Math.round(w*.7);c2.height=Math.round(h*.7);c2.getContext("2d").drawImage(c,0,0,c2.width,c2.height);out=c2.toDataURL("image/jpeg",.72)}
  res(out.length>maxChars?null:out)};im.onerror=()=>res(null);im.src=fr.result};fr.onerror=()=>res(null);fr.readAsDataURL(file)})}
function mediaModal(id){
  const s=slotList().find(x=>x.id===id)||{id,label:id.startsWith("mus-")?"Artwork":id,r:"1/1"},m=S.media[id]||{};
  if(s.kind){
    openModal('<h3>'+esc(s.label)+'</h3><p class="muted">'+esc(s.note||"")+'</p><form id="mf" style="display:flex;flex-direction:column;gap:12px"><label class="f">Link (https)<input class="i" type="url" name="url" value="'+esc(m.url||"")+'" placeholder="https://…"></label>'+(s.kind==="video"?'<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" name="audio"'+(m.audio?" checked":"")+'> The film has a licensed soundtrack (plays only when a visitor turns sound on)</label>':'')+'<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" name="pub"'+(m.hidden?"":" checked")+'> Published</label>'+
      '<p class="muted" style="font-size:12.5px">Firebase\'s free plan can\'t hold video or audio files, so host the file somewhere you control (for example, a Cloudflare R2 bucket or your repo\'s <span class="mono">media/</span> folder) and paste its link.</p><div class="row"><button type="button" class="btn ghost" data-act="close-modal">Cancel</button><button class="btn olive" type="submit">Save</button></div></form>',
      el=>el.querySelector("#mf").addEventListener("submit",async ev=>{ev.preventDefault();const f=ev.target;const url=f.url.value.trim();if(url&&!/^https:\/\//.test(url)){toast("Use an https:// link");return}
        if(!url){if(await remove("media",id)){closeModal();toast("Removed")}return}
        if(await save("media",id,{kind:s.kind,url,audio:!!(f.audio&&f.audio.checked),hidden:!f.pub.checked,updatedAt:new Date().toISOString()})){closeModal();toast("Saved")}}));return;
  }
  const cur=m.data||ASSETS[DEFIMG[id]]||"";let data=null,focal=(m.focal||"50% 50%"),zoom=Number(m.zoom)||1;
  openModal('<h3>'+esc(s.label)+'</h3>'+(s.prot?'<div class="banner warn" style="margin:0">This is a protected brand asset. The original Groove Vine is interactive; an uploaded picture replaces it with a still image plus a company list.</div>':'')+
    '<form id="mf" style="display:flex;flex-direction:column;gap:12px"><label class="f">New image (JPG, PNG or WebP)<input class="i" type="file" accept="image/jpeg,image/png,image/webp" id="mfile"></label>'+
    '<div class="f" style="font-size:13px;font-weight:600;color:var(--muted)">Focal point: click the picture where the subject is<div class="focus-frame" id="ff" style="aspect-ratio:'+esc(s.r||"16/9")+';margin-top:6px">'+(cur?'<img id="fimg" src="'+esc(cur)+'" alt="">':'<div class="empty" id="fimg0" style="height:100%;display:grid;place-items:center">Choose an image</div>')+'<span class="focus-dot" id="fdot"></span></div><span style="font-weight:400">The frame shows how it\'s cropped on the site.</span></div>'+
    '<label class="f">Zoom<input type="range" min="1" max="2" step=".05" id="mzoom" value="'+zoom+'"></label>'+
    '<label class="f">Alt text (describe the picture for screen readers)<input class="i" name="alt" value="'+esc(m.alt||"")+'"></label>'+
    '<label class="f">Description / credit (back office only)<input class="i" name="desc" value="'+esc(m.desc||"")+'"></label>'+
    '<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" name="pub"'+(m.hidden?"":" checked")+'> Published (visitors see this image)</label>'+
    (s.prot?'<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" name="sure"> I\'m intentionally replacing the original Groove Vine</label>':'')+
    '<div class="row"><button type="button" class="btn ghost" data-act="close-modal">Cancel</button><button class="btn olive" type="submit">Save image</button></div></form>',
  el=>{
    const ff=el.querySelector("#ff"),dot=el.querySelector("#fdot"),zr=el.querySelector("#mzoom");
    const paint=()=>{const im=el.querySelector("#fimg");const [x,y]=focal.split(" ");dot.style.left=x;dot.style.top=y;if(im){im.style.objectPosition=focal;im.style.transform=zoom>1?"scale("+zoom+")":"";im.style.transformOrigin=focal}};paint();
    ff.addEventListener("click",e=>{const r=ff.getBoundingClientRect();focal=Math.round((e.clientX-r.left)/r.width*100)+"% "+Math.round((e.clientY-r.top)/r.height*100)+"%";paint()});
    zr.addEventListener("input",()=>{zoom=Number(zr.value);paint()});

    el.querySelector("#mf").addEventListener("submit",async ev=>{ev.preventDefault();const f=ev.target;
      if(s.prot&&!f.sure.checked){toast("Tick the box to confirm you're replacing the vine");return}
      if(!data&&!m.data&&!cur){toast("Choose an image first");return}
      const rec={alt:f.alt.value.trim(),desc:f.desc.value.trim(),focal,zoom,hidden:!f.pub.checked,updatedAt:new Date().toISOString(),by:S.uid||""};
      const base=data||m.data||"";if(base)rec.data=base;else if(DEFIMG[id])rec.def=true;else{toast("Choose an image first");return}
      if(data&&m.data){const prev={data:m.data,alt:m.alt||"",focal:m.focal||"",zoom:m.zoom||1};if(JSON.stringify(rec).length+JSON.stringify(prev).length<980000)rec.prev=prev}

  });
}
