/* PDF → lines of text, top to bottom, left to right */
async function pdfLines(file){
  const L=await loadPdfJs();const buf=new Uint8Array(await file.arrayBuffer());
  const doc=await L.getDocument({data:buf}).promise;const out=[];
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p);const tc=await page.getTextContent();const rowsY=[];
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const x=it.transform[4],y=it.transform[5];let r=rowsY.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,items:[]};rowsY.push(r)}r.items.push({x,s:it.str,w:it.width||0})});
    rowsY.sort((a,b)=>b.y-a.y).forEach(r=>{r.items.sort((a,b)=>a.x-b.x);let line="",end=null;r.items.forEach(i=>{if(end!==null)line+=(i.x-end>12?"   ":" ");line+=i.s.trim();end=i.x+i.w});out.push(line.trim())});
  }
  return out;
}

/* ---- statement parsing ---- */
const MONTHS3={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
const DATE_AT_START=/^\s*(\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?|\d{4}-\d{2}-\d{2}|(?:jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?\s+\d{1,2}(?:,?\s+\d{4})?)\b/i;
const AMT_G=/\(?-?\s?\$?\s?\d{1,3}(?:,\d{3})*\.\d{2}\)?(?:\s?(?:CR|DR)\b|-(?=\s|$))?/gi;
function toISO(raw,yearHint,endMonth){
  raw=raw.trim().replace(/\./g,"/");let y,m,d,mm;
  if((mm=/^(\d{4})-(\d{2})-(\d{2})$/.exec(raw))){y=+mm[1];m=+mm[2];d=+mm[3]}
  else if((mm=/^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?$/.exec(raw))){m=+mm[1];d=+mm[2];y=mm[3]?(+mm[3]<100?2000+(+mm[3]):+mm[3]):null}
  else if((mm=/^([a-z]+)\/?\s+(\d{1,2})(?:,?\s+(\d{4}))?$/i.exec(raw))){m=MONTHS3[mm[1].slice(0,4).toLowerCase()]||MONTHS3[mm[1].slice(0,3).toLowerCase()];d=+mm[2];y=mm[3]?+mm[3]:null}
  if(!m||!d||m>12||d>31)return null;
  if(!y){y=yearHint;if(endMonth&&m>endMonth+1)y=yearHint-1}
  return y+"-"+pad(m)+"-"+pad(d);
}
function amtVal(s){const neg=/^\(|\)$|^-|-\s*$|\bDR\b/i.test(s.trim())||/-\s?\$/.test(s);const v=parseFloat(s.replace(/[^\d.]/g,""));return isNaN(v)?null:(neg?-v:v)}
const IN_WORDS=/\b(deposit|credit|transfer from|payout|refund|received|incoming|zelle from|cash app from|venmo from|interest paid|reversal|ach credit|direct dep|mobile deposit)\b/i;
const OUT_WORDS=/\b(purchase|debit|withdrawal|payment to|pos\b|card \d{4}|ach debit|fee|charge|transfer to|zelle to|bill pay|atm|check\s?#?\d+|subscription|autopay)\b/i;
const PLATFORMS=[["stripe","Stripe"],["shopify","Shopify"],["paypal","PayPal"],["square","Square"],["cash app","Cash App"],["cashapp","Cash App"],["venmo","Venmo"],["zelle","Zelle"],["patreon","Patreon"],["gofundme","GoFundMe"],["givebutter","Givebutter"],["kdp","Amazon KDP"],["amazon","Amazon"],["youtube","YouTube"],["google","Google"],["tiktok","TikTok"],["eventbrite","Eventbrite"],["etsy","Etsy"],["ebay","eBay"],["distrokid","DistroKid"],["spotify","Spotify"],["apple","Apple"],["netlify","Netlify"],["squarespace","Squarespace"],["adobe","Adobe"],["canva","Canva"],["uber","Uber"],["lyft","Lyft"]];
const DONATION_RE=/\b(donat|gofundme|patreon|givebutter|tip(s|ping)?\b|sponsor|gift)/i;
const CAT_RULES=[[/\b(uber|lyft|delta|united|american air|southwest|airbnb|hotel|marriott|hilton|parking|shell|exxon|chevron|bp\b|gas)\b/i,"Travel"],[/\b(adobe|google|squarespace|netlify|canva|openai|anthropic|github|microsoft|apple\.com|dropbox|zoom|notion|figma|firebase)\b/i,"Software"],[/\b(meta|facebook|instagram|tiktok ads|ads\b|promo|printing|vistaprint)\b/i,"Marketing"],[/\b(fee|service charge|overdraft|interest charge)\b/i,"Fees"],[/\b(restaurant|cafe|coffee|starbucks|doordash|grubhub|uber eats|chipotle|mcdonald)\b/i,"Food & drink"],[/\b(guitar center|sweetwater|b&h|best buy|amazon)\b/i,"Equipment"],[/\b(payroll|gusto|adp)\b/i,"Payroll"]];
const DEFAULT_RULES=[{k:"vybr8",b:"vybr8"},{k:"pathd",b:"pathd"},{k:"w4w",b:"w4w"},{k:"drawup",b:"aec"},{k:"shadow crown",b:"scu"},{k:"kdp",b:"scu"},{k:"whatiftmw",b:"wit"},{k:"what if tomorrow",b:"wit"},{k:"grooveville music",b:"music"},{k:"distrokid",b:"music"},{k:"grooveville ent",b:"ent"},{k:"eventbrite",b:"ent"},{k:"grooveville rentals",b:"rentals"}];
const convRules=()=>((S.convRules&&S.convRules.rules)||DEFAULT_RULES);
function matchBrand(text){const t=" "+String(text).toLowerCase()+" ";const r=convRules().find(r=>r.k&&t.includes(String(r.k).toLowerCase()));return r?{brand:r.b,rule:r.k,source:r.src||""}:null}
function platformOf(text){const t=String(text).toLowerCase();const p=PLATFORMS.find(([k])=>t.includes(k));return p?p[1]:""}
function cleanDesc(s){return String(s).replace(/\s{2,}/g," ").replace(/\b(pos|ach|ppd|ccd|web|id:?\s*\w+|card\s*\d{4}|xx+\d+)\b/gi," ").replace(/\s{2,}/g," ").trim().slice(0,90)}
function finishRow(r){
  const m=matchBrand(r.desc);const plat=platformOf(r.desc);
  r.brand=m?m.brand:"hq";r.matched=!!m;r.platform=plat;
  r.type=r.amount>=0?"income":"expense";
  r.source=r.type==="income"?((m&&m.source)||(DONATION_RE.test(r.desc)?"Donation":"Payment")):"";
  r.category=r.type==="expense"?((CAT_RULES.find(([re])=>re.test(r.desc))||[])[1]||"Other"):"";
  r.title=cleanDesc(r.desc)||"Bank transaction";
  r.fp=r.date+"|"+r.amount.toFixed(2)+"|"+r.title.toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,24);
  r.dup=ledgerAll().some(l=>l.fp===r.fp);r.include=!r.dup;r.id=r.id||uid();
  return r;
}
function parseStatementLines(lines){
  const text=lines.join("\n");
  const years=(text.match(/\b20\d{2}\b/g)||[]).map(Number).filter(y=>y>=2015&&y<=2100);
  const per=/(?:statement period|period|for)\b[^\n]*?(\d{1,2}[\/\-]\d{1,2}[\/\-](\d{2,4}))\s*(?:-|to|through|–)\s*(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/i.exec(text);
  let yearHint=years.length?Math.max(...years):new Date().getFullYear(),endMonth=0;
  if(per){yearHint=+per[5]<100?2000+(+per[5]):+per[5];endMonth=+per[3]}
  const rows=[],skipped=[];let section=0,prevBal=null,last=null;
  lines.forEach(line=>{
    const L=line.trim();if(!L)return;
    const dm=DATE_AT_START.exec(L);const amts=(L.match(AMT_G)||[]).map(s=>s.trim());
    if(!dm){
      if(!amts.length&&/(deposits|credits|additions|money in|incoming)/i.test(L)){section=1;last=null;return}
      if(!amts.length&&/(withdrawals|debits|subtractions|checks paid|purchases|payments|fees|money out|outgoing|card transactions)/i.test(L)){section=-1;last=null;return}
      if(/(beginning|opening|previous) balance/i.test(L)&&amts.length)prevBal=amtVal(amts[amts.length-1]);
      else if(last&&!amts.length&&L.length<70&&!/page \d|continued|balance|total|summary|account|statement/i.test(L)){last.desc+=" "+L;}
      else if(amts.length)skipped.push(L);
      return;
    }
    if(!amts.length){skipped.push(L);return}
    const date=toISO(dm[1],yearHint,endMonth);
    let desc=L.slice(dm[0].length);amts.forEach(a=>{desc=desc.replace(a,"")});desc=desc.replace(/\s{2,}/g," ").trim();
    if(/(beginning|ending|opening|closing|daily|available)\s+balance|^total|balance forward/i.test(desc)){prevBal=amtVal(amts[amts.length-1]);last=null;return}
    if(!date){skipped.push(L);return}
    let raw=amts[0],val=amtVal(raw),bal=amts.length>=2?amtVal(amts[amts.length-1]):null;
    if(val===null){skipped.push(L);return}
    const explicit=/^\(|\)$|^-|-$|\bDR\b|\bCR\b/i.test(raw);
    let sign=0;
    if(explicit)sign=/\bCR\b/i.test(raw)?1:(val<0?-1:1);
    else if(prevBal!==null&&bal!==null&&Math.abs(Math.abs(bal-prevBal)-Math.abs(val))<0.011)sign=bal>=prevBal?1:-1;
    else if(section)sign=section;
    else if(IN_WORDS.test(desc))sign=1;
    else if(OUT_WORDS.test(desc))sign=-1;

    if(bal!==null)prevBal=bal;
    const r={date,desc,amount:Math.abs(val)*sign,raw:L,how:explicit?"sign":(sign&&section?"section":"words")};

}
function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"')q=true;else if(c===","){row.push(cell);cell=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}else cell+=c}
  if(cell||row.length){row.push(cell);rows.push(row)}
  const hi=rows.findIndex(r=>r.some(c=>/date/i.test(c))&&r.some(c=>/amount|debit|credit|withdraw|deposit/i.test(c)));
  if(hi<0)return null;
  const H=rows[hi].map(h=>h.trim().toLowerCase());const col=re=>H.findIndex(h=>re.test(h));
  const cD=col(/date/),cDesc=col(/desc|memo|payee|name|details|transaction/),cA=col(/^amount|amount$/),cDr=col(/debit|withdraw|money out/),cCr=col(/credit|deposit|money in/);
  const out=[];
  rows.slice(hi+1).forEach(r=>{if(!r[cD])return;const date=toISO(r[cD].trim().split(" ")[0],new Date().getFullYear());if(!date)return;
    let a=null;if(cA>=0&&r[cA])a=amtVal(r[cA]);else{const dr=cDr>=0?amtVal(r[cDr]||""):null,cr=cCr>=0?amtVal(r[cCr]||""):null;if(cr)a=Math.abs(cr);else if(dr)a=-Math.abs(dr)}
    if(a===null||a===0)return;out.push({date,desc:(r[cDesc]||"").trim(),amount:a,raw:r.join(", "),how:"csv"})});
  return {rows:out.map(finishRow),skipped:[],period:""};
}

/* ---- events & emails ---- */
function findDate(text,noRoll){
  const t=String(text);let m;
  if((m=/\b(\d{4}-\d{2}-\d{2})\b/.exec(t)))return m[1];
  if((m=/\b(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/.exec(t)))return toISO(m[0],new Date().getFullYear());
  if((m=/\b(?:(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*,?\s+)?((?:jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?\s+\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(\d{4}))?/i.exec(t))){
    const y=m[2]?+m[2]:new Date().getFullYear();let iso=toISO(m[1].replace(/\./,"")+" "+y,y);if(iso&&!m[2]&&!noRoll&&iso<today())iso=(y+1)+iso.slice(4);return iso}
  if((m=/\b(\d{1,2})\/(\d{1,2})\b/.exec(t))){let iso=toISO(m[0],new Date().getFullYear());if(iso&&!noRoll&&iso<today())iso=(+iso.slice(0,4)+1)+iso.slice(4);return iso}
  return "";
}
function findTimes(text){
  const rngFirst=/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|to)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i.exec(text);
  if(rngFirst){const ap1=rngFirst[3]||rngFirst[6];let s=+rngFirst[1]%12;if(/p/i.test(ap1))s+=12;let e=+rngFirst[4]%12;if(/p/i.test(rngFirst[6]))e+=12;return [pad(s)+":"+(rngFirst[2]||"00"),pad(e)+":"+(rngFirst[5]||"00")]}
  const re=/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)/gi;const out=[];let m;
  while((m=re.exec(text))&&out.length<2){let h=+m[1]%12;if(/p/i.test(m[3]))h+=12;out.push(pad(h)+":"+(m[2]||"00"))}
  const rng=/\b(\d{1,2})(?::(\d{2}))?\s*[-–to]+\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i.exec(text);
  if(rng&&out.length<2){let e=+rng[3]%12;if(/p/i.test(rng[5]))e+=12;let s=+rng[1]%12;if(/p/i.test(rng[5])&&s+12<=e)s+=12;return [pad(s)+":"+(rng[2]||"00"),pad(e)+":"+(rng[4]||"00")]}
  return out;
}
function headerVal(text,name){const m=new RegExp("^"+name+":\\s*(.+)$","im").exec(text);return m?m[1].trim():""}
function readEvent(text){
  const lines=String(text).split(/\n/).map(s=>s.trim()).filter(Boolean);
  const subj=headerVal(text,"subject");const title=(subj||lines.find(l=>!/^(from|to|date|sent|subject|cc):/i.test(l))||"New event").replace(/^(re|fwd?):\s*/i,"").slice(0,90);
  const tm=findTimes(text);const loc=(/\b(?:at|location|venue|where)\s*[:\-]?\s+([A-Z0-9][^\n.,]{3,60})/.exec(text)||[])[1]||"";
  const link=(/(https?:\/\/[^\s)]+)/.exec(text)||[])[1]||"";const mb=matchBrand(text);
  const tl=String(text).toLowerCase();const dm=/every\s+(sun|mon|tue|wed|thu|fri|sat)/.exec(tl);
  const repeat=/every other week|bi-?weekly|every 2 weeks/.test(tl)?"biweekly":(dm||/\bweekly\b|every week/.test(tl))?"weekly":/\bdaily\b|every day/.test(tl)?"daily":/\bmonthly\b|every month/.test(tl)?"monthly":/\byearly\b|annual|every year/.test(tl)?"yearly":"";
  const days=dm?[["sun","mon","tue","wed","thu","fri","sat"].indexOf(dm[1])]:[];
  return {repeat,days,title,date:findDate(text)||today(),start:tm[0]||"",end:tm[1]||"",location:loc.trim(),link,brand:mb?mb.brand:"hq",visibility:"private",description:String(text).trim().slice(0,1500),toCal:true,toLog:true,toDoc:false};
}
const KINDS=["Complaint","Question","Collab request","Payment","Booking","Other"];
function readEmail(text){
  const from=headerVal(text,"from"),subject=headerVal(text,"subject"),dateH=headerVal(text,"date")||headerVal(text,"sent");
  const body=String(text).replace(/^(from|to|cc|date|sent|subject):.*$/gim,"").trim();
  const t=(subject+" "+body).toLowerCase();
  const kind=/(complain|refund|issue|problem|disappoint|broken|unhappy|wrong|never received|charged twice|not working|terrible|bad experience)/.test(t)?"Complaint":/(collab|partner|sponsor|feature|work together)/.test(t)?"Collab request":/(book|reserve|availability|rental|quote)/.test(t)?"Booking":/(invoice|payment|paid|receipt)/.test(t)?"Payment":/\?/.test(t)?"Question":"Other";
  const mb=matchBrand(text);const ev=findDate(body,true);
  return {from,subject:subject||body.split("\n")[0].slice(0,80)||"Message",date:findDate(dateH)||today(),kind,brand:mb?mb.brand:"hq",summary:body.slice(0,1500),followUp:addDays(today(),2),eventDate:ev&&ev>today()?ev:"",toLog:true,toRem:kind!=="Other",toCal:false,toCollab:kind==="Collab request",toDoc:false};
}

/* ---- storage helper shared with Documents ---- */
async function storeDocBlob(blob,name,meta){
  const b64=await readB64(blob),id=uid(),n=Math.max(1,Math.ceil(b64.length/CHUNK));
  for(let i=0;i<n;i++){if(!await putChunk(id,i,b64.slice(i*CHUNK,(i+1)*CHUNK)))throw {code:"chunk"}}
  if(!await save("docs",id,Object.assign({name,type:blob.type||"application/octet-stream",size:blob.size,chunks:n,brand:"hq",category:"Other",date:today(),notes:"",uploadedAt:new Date().toISOString()},meta)))throw {code:"meta"};
  return id;
}

/* ---- actions ---- */
function convReset(keepMode){S.conv={mode:keepMode||S.conv.mode||"stmt",saveDoc:true}}
async function convLoadStatement(file){
  const c=S.conv;c.err="";c.busy="Reading "+file.name+"…";c.rows=null;c.file=file;c.fileName=file.name;render();
  try{
    let res;
    if(/\.csv$/i.test(file.name)||file.type==="text/csv")res=parseCSV(await file.text());
    else{const lines=await pdfLines(file);res=parseStatementLines(lines);if(!res.rows.length&&lines.join("").length<40)c.err="This PDF has no readable text. It's probably a scanned image. Download the statement as a text PDF or CSV from your bank's website."}
    if(!res){c.err="Couldn't find date and amount columns in this CSV.";c.busy="";return render()}
    c.rows=res.rows;c.skipped=res.skipped;c.period=res.period;c.busy="";
  }catch(e){c.busy="";c.err="Couldn't open that file. Make sure it's a PDF or CSV statement."+(e&&e.message==="load"?" (The PDF reader didn't load; check your internet connection.)":"")}
  render();
}
async function convPost(btn){
  const c=S.conv;const inc=c.rows.filter(r=>r.include);if(!inc.length)return;
  btn.disabled=true;btn.textContent="Adding…";let docId="";
  try{
    if(c.saveDoc!==false&&c.file)docId=await storeDocBlob(c.file,c.fileName,{brand:"hq",category:"Bank statement",date:(inc[inc.length-1]||{}).date||today(),notes:"Converted: "+inc.length+" transactions"});
    else if(c.saveDoc!==false&&c.pasted)docId=await storeDocBlob(new Blob([c.pasted],{type:"text/plain"}),"Pasted statement "+today()+".txt",{brand:"hq",category:"Bank statement",notes:"Converted: "+inc.length+" transactions"});
    let n=0;
    for(const r of inc){
      const rec={brand:r.brand,type:r.amount>=0?"income":"expense",date:r.date,title:r.title,amount:Math.round(Math.abs(r.amount)*100)/100,vendor:r.platform||r.title,category:r.amount>=0?"":r.category,notes:"From bank statement"+(c.fileName?" · "+c.fileName:""),fp:r.fp,fromStatement:docId,createdAt:new Date().toISOString(),by:S.uid||""};
      if(r.amount>=0)rec.source=r.source||"Payment";else{rec.payment="Business card";rec.receiptNo=""}
      if(await save("ledger",uid(),rec))n++;
    }
    await save("conversions",uid(),{kind:"Bank statement",title:c.fileName||"Pasted statement",brands:[...new Set(inc.map(r=>r.brand))],items:n,docId,at:new Date().toISOString()});
    toast(n+" transactions added"+(docId?" · statement saved to Documents":""));convReset("stmt");render();
  }catch(e){btn.disabled=false;btn.textContent="Try again";toast("Stopped partway. Check your connection; already-added rows show as “Already logged”.")}
}

/* Light, motion and lens effects layered on the entry still (positions are fractions of the picture). */
function introFX(cv){
  const ctx=cv.getContext("2d");let W,H,dpr,img={x:0,y:0,w:1,h:1};
  const size=()=>{dpr=Math.min(devicePixelRatio||1,1.5);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    let w=W,h=W/SHOT_R;if(h<H){h=H;w=H*SHOT_R}img={x:(W-w)*.52,y:(H-h)*.5,w,h}};
  size();addEventListener("resize",size);
  const P=(fx,fy)=>[img.x+fx*img.w,img.y+fy*img.h];
  const TAIL=[[.371,.88,.6],[.678,.871,.5],[.732,.889,.7],[.848,.894,.8]],LAMPS=[[.083,.537],[.171,.461],[.255,.674],[.342,.674],[.841,.722],[.66,.69]];
  const VP=[.534,.79];
  const streaks=Array.from({length:26},(_,i)=>({s:Math.random(),side:i%2?1:-1,off:.15+Math.random()*.85,sp:.35+Math.random()*.5,c:Math.random()<.5?"#fff1dc":"#ffb27a"}));
  const dust=Array.from({length:34},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*2.2,v:.004+Math.random()*.01,a:.15+Math.random()*.35}));
  const glow=(x,y,r,col,a)=>{const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,"rgba(0,0,0,0)");ctx.globalAlpha=a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.globalAlpha=1};
  const t0=performance.now();
  const frame=now=>{const t=(now-t0)/1000,u=img.w/1562;ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    // main car taillights: glow + anamorphic streak
    const pulse=.85+.15*Math.sin(t*2.1)+(Math.sin(t*.7)>.96?.25:0);
    const [ax,ay]=P(.396,.905),[bx]=P(.652,.905);
    for(let k=0;k<6;k++){const x=ax+(bx-ax)*k/5;glow(x,ay,46*u,"rgba(255,70,40,.9)",.22*pulse)}
    let g=ctx.createLinearGradient(ax-420*u,0,bx+420*u,0);g.addColorStop(0,"rgba(255,80,50,0)");g.addColorStop(.3,"rgba(255,90,60,.35)");g.addColorStop(.5,"rgba(255,170,140,.55)");g.addColorStop(.7,"rgba(255,90,60,.35)");g.addColorStop(1,"rgba(255,80,50,0)");
    ctx.globalAlpha=.5*pulse;ctx.fillStyle=g;ctx.fillRect(ax-420*u,ay-1.6*u,bx-ax+840*u,3.2*u);ctx.globalAlpha=1;
    TAIL.forEach(([x,y,a],i)=>{const [px,py]=P(x,y);glow(px,py,26*u,"rgba(255,60,40,.9)",.25*a*(.8+.2*Math.sin(t*3+i)))});
    LAMPS.forEach(([x,y],i)=>{const [px,py]=P(x,y);glow(px,py,(38+6*Math.sin(t*1.3+i*2))*u,"rgba(255,190,120,.9)",.28)});
    // road speed streaks flowing from the vanishing point toward the camera
    const [vx,vy]=P(VP[0],VP[1]);const [c1x,c1y]=P(.35,.6),[c2x]=P(.67,.6);ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.rect(c2x,c1y,c1x-c2x,H);ctx.clip("evenodd");
    streaks.forEach(s=>{s.s+=s.sp*.016*(1+s.s*2.5);if(s.s>1){s.s=0;s.off=.15+Math.random()*.85}
      const k=s.s*s.s,x=vx+s.side*(s.off*img.w*.75)*k,y=vy+(H-vy+40*u)*k,len=(10+160*k)*u;
      const dx=s.side*s.off*img.w*.75,dy=H-vy,dl=Math.hypot(dx,dy);
      ctx.strokeStyle=s.c;ctx.globalAlpha=Math.min(.55,k*1.3);ctx.lineWidth=Math.max(.6,2.6*k*u*2);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-dx/dl*len,y-dy/dl*len);ctx.stroke()});
    ctx.globalAlpha=1;ctx.restore();
    // floating dust and bokeh catching the sunset
    dust.forEach(d=>{d.x+=d.v*.06;d.y-=d.v*.02;if(d.x>1)d.x=0;if(d.y<0)d.y=1;glow(d.x*W,d.y*H,d.r*6,"rgba(255,200,160,.9)",d.a*.4)});
    // sun bloom behind the skyline
    const [sx,sy]=P(.5,.42);glow(sx,sy,img.w*.35,"rgba(255,140,90,.5)",.18+.04*Math.sin(t*.5));
    ctx.globalCompositeOperation="source-over";
    INTRO_RAF=requestAnimationFrame(frame)};
  INTRO_RAF=requestAnimationFrame(frame);
}

function liveMount(){

  const vid=el.dataset.vid;if(LV.player&&LV.vid===vid&&document.getElementById(LV.frameId))return;

    LV.player=new YT.Player("ytLiveFrame",{videoId:vid,width:"100%",height:"100%",playerVars:{autoplay:0,playsinline:1,rel:0,modestbranding:1},events:{onStateChange:e=>{
      const st=e.data;
      if(st===1){LV.playing=true;if(RD.playing){LV.radioWas=true;radioPause()}}
      else if(st===2||st===0){LV.playing=false;liveResumeRadio()}}}})};
  if(window.YT&&window.YT.Player)return make();
  const prev=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{if(prev)prev();make()};
  if(!document.getElementById("ytapi")){const s=document.createElement("script");s.id="ytapi";s.src="https://www.youtube.com/iframe_api";s.onerror=()=>{const h=$("#ytLive");if(h)h.innerHTML='<iframe title="Live on YouTube" style="width:100%;height:100%;border:0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen src="https://www.youtube-nocookie.com/embed/'+esc(vid)+'"></iframe>'};document.head.appendChild(s)}
}

function liveUnmount(keepRadio){if(LV.player){try{LV.player.destroy()}catch(e){}LV.player=null}if(LV.playing){LV.playing=false;if(!keepRadio)liveResumeRadio()}}

/* sign-in hook: accept invitations, find this person's Studio roles */
async function studioCheck(){
  if(!S.db||!S.uid||SR().checking)return;SR().checking=true;subscribeShows();
  const email=String(S.email||"").toLowerCase().trim();
  try{ if(email&&BACKEND==="firebase"){const inv=await S.db.doc("invites/"+email).get();
      if(inv.exists){const v=inv.data();
        if(v.role==="manager")await S.db.doc("studioRoles/"+S.uid).set({role:"manager",email,at:new Date().toISOString(),by:v.by||""});
        else await S.db.doc("shows/"+v.show+"/members/"+S.uid).set({role:v.role,uid:S.uid,email,at:new Date().toISOString(),by:v.by||""});
        await S.db.doc("invites/"+email).delete();toast("You've been added to Grooveville Entertainment Studio")}}}catch(e){}
  try{const m=await S.db.doc("studioRoles/"+S.uid).get();SR().manager=m.exists&&m.data().role==="manager"}catch(e){}
  for(const id of [...new Set(Object.keys(SHOW_DEFAULTS).concat(Object.keys(S.shows||{})))]){try{const d=await S.db.doc("shows/"+id+"/members/"+S.uid).get();if(d.exists)SR().member[id]=d.data();else delete SR().member[id]}catch(e){}}
  SR().checked=true;SR().checking=false;if(!studioShows().includes(SR().show)&&studioShows()[0])SR().show=studioShows()[0];scheduleRender(true);
}
function studioSubscribe(){
  const s=SR().show,k=s+(S.isAdmin?"A":"")+sRank(s);if(SR().subs[k]||!S.db)return;SR().subs[k]=1;SR().d={};
  const on=(name,col)=>S.db.collection(col).onSnapshot(snap=>{SR().d[name]=rows(snap,col);if(S.route.startsWith("studio"))scheduleRender(true)},()=>{SR().d[name]=SR().d[name]||[]});
  ["members","episodes","clips","calendar"].forEach(n=>on(n,"shows/"+s+"/"+n));
  if(sRank(s)>=2)on("jobs","shows/"+s+"/jobs");
  if(sRank(s)>=4){on("invites","invites");on("managers","studioRoles")}
  S.db.collection("studioWorker").onSnapshot(snap=>{SR().worker=rows(snap,"studioWorker");if(S.route.startsWith("studio"))scheduleRender(true)},()=>{});
  studioStatus();studioEpisodes();
}

    if(sRank(s)>=4&&st.channelId&&(S.shows[s]||{}).channelId!==st.channelId)save("shows",s,Object.assign({name:showCfg(s).name,youtube:showCfg(s).youtube},S.shows[s]||{},{channelId:st.channelId,channelTitle:st.channelTitle||""}))}catch(e){SR().status={error:String(e.message||e)}}if(S.route.startsWith("studio"))scheduleRender(true)}

      (c.exportKey?'<button class="btn ghost sm" data-act="st-dl" data-key="'+esc(c.exportKey)+'">Download MP4</button>':rk>=2&&["draft","review","approved"].includes(c.status)?'<button class="btn ghost sm" data-act="st-render" data-id="'+esc(c.id)+'">'+(c.renderStatus==="queued"?"Render queued":"Render MP4")+'</button>':'')+
      (rk>=2?'<button class="btn ghost sm" data-act="st-editclip" data-id="'+esc(c.id)+'">Edit</button>':'')+'</div></div>'}).join("")+'</div>':'<div class="empty">No clips '+esc(((CLIP_STATUS.find(x=>x[0]===f)||[])[1]||"").toLowerCase())+'.</div>');
}

/* ---------- actions ---------- */
function studioAct(a,t){
  if(!a.startsWith("st-"))return false;
  const s=SR().show,rk=sRank(),col=n=>"shows/"+s+"/"+n;
  if(a==="st-refresh"){studioStatus();studioEpisodes();toast("Refreshing");return true}
  if(a==="st-sync"){t.disabled=true;sApi("/api/sync").then(r=>{SR().status=Object.assign({},SR().status,r);toast(r.errors&&r.errors.length?"Synced with warnings":"Synced with YouTube");studioEpisodes();render()}).catch(e=>{toast(e.message);t.disabled=false});return true}
  if(a==="st-qf"){SR().queueF=t.dataset.v;render();return true}
  if(a==="st-openep"){SR().clipEp=t.dataset.id;SR().edit=null;SR().recUrl="";location.hash="#studio-clips";return true}
  if(a==="st-newclip"){SR().edit=null;render();return true}
  if(a==="st-editclip"){const c=sd("clips").find(x=>x.id===t.dataset.id);if(c){SR().edit=Object.assign({},c);SR().clipEp=c.episodeId;if(!S.route.startsWith("studio-clips"))location.hash="#studio-clips";else render();window.scrollTo(0,0)}return true}
  if(a==="st-mark"){const tm=stCurTime();const inp=$('#stClipForm input[name='+t.dataset.k+']');if(inp&&tm!=null){inp.value=mmss(tm)}else toast("Start the preview, then mark");return true}
  if(a==="st-preview"){const f=$("#stClipForm"),a1=toSec(f.start.value),b1=toSec(f.end.value);if(isNaN(a1)){toast("Set a start time");return true}stSeek(a1,isNaN(b1)?null:b1);return true}
  if(a==="st-rec"){const ep=epList().find(e=>e.id===SR().clipEp);if(!ep||!ep.recordingKey)return true;sApi("/api/studio/file",{key:ep.recordingKey}).then(r=>{SR().recUrl=r.url;SR().recFor=ep.id;render()}).catch(e=>toast(e.message));return true}
  if(a==="st-gen"){const ep=epList().find(e=>e.id===SR().clipEp);if(!ep)return true;save(col("jobs"),uid(),{type:"highlights",episodeId:ep.id,recordingKey:ep.recordingKey||"",status:"queued",createdBy:S.uid,createdAt:new Date().toISOString(),options:{formats:["9:16"],maxClips:8,minSec:15,maxSec:75}}).then(ok=>ok&&toast("Queued for the AI worker"));return true}
  if(a==="st-render"){const c=sd("clips").find(x=>x.id===t.dataset.id);if(!c)return true;const ep=epList().find(e=>e.id===c.episodeId)||{};if(!ep.recordingKey){toast("Upload the episode recording first");return true}
    save(col("jobs"),uid(),{type:"render",episodeId:c.episodeId,clipId:c.id,clipTitle:c.title,recordingKey:ep.recordingKey,status:"queued",createdBy:S.uid,createdAt:new Date().toISOString()}).then(ok=>{if(ok){save(col("clips"),c.id,Object.assign(stripC(c),{renderStatus:"queued",updatedAt:new Date().toISOString()}));toast("Render queued")}});return true}
  if(a==="st-dl"){sApi("/api/studio/file",{key:t.dataset.key}).then(r=>{window.open(r.url,"_blank","noopener")}).catch(e=>toast(e.message));return true}
  if(a==="st-savecap"){const c=sd("clips").find(x=>x.id===t.dataset.id),ta=document.querySelector('[data-cap="'+t.dataset.id+'"]');if(c&&ta)save(col("clips"),c.id,Object.assign(stripC(c),{postCaption:ta.value,updatedAt:new Date().toISOString()})).then(ok=>ok&&toast("Caption saved"));return true}
  if(a==="st-status"){const c=sd("clips").find(x=>x.id===t.dataset.id),v=t.dataset.v;if(!c)return true;
    if(v==="publish"){openModal('<h3>Mark as published</h3><form id="mf" style="display:flex;flex-direction:column;gap:12px"><label class="f">Platform<select class="i" name="platform">'+PUB_TARGETS.map(p=>'<option>'+p+'</option>').join("")+'</select></label><label class="f">Post link<input class="i" type="url" name="url" placeholder="https://"></label><div class="row"><button type="button" class="btn ghost" data-act="close-modal">Cancel</button><button class="btn olive">Save</button></div></form>',
      el=>el.querySelector("#mf").addEventListener("submit",async ev=>{ev.preventDefault();const o=formObj(ev.target);const log=(c.publishLog||[]).concat({platform:o.platform,url:o.url,at:new Date().toISOString(),by:S.uid});
        if(await save(col("clips"),c.id,Object.assign(stripC(c),{status:"published",publishLog:log,platforms:[...new Set((c.platforms||[]).concat(o.platform))],updatedAt:new Date().toISOString()}))){closeModal();toast("Logged")}}));return true}
    if(v==="rejected"){openModal('<h3>Send back with a note</h3><form id="mf"><textarea class="i" name="note" placeholder="What needs to change?"></textarea><div class="row"><button type="button" class="btn ghost" data-act="close-modal">Cancel</button><button class="btn olive">Reject</button></div></form>',el=>el.querySelector("#mf").addEventListener("submit",async ev=>{ev.preventDefault();if(await save(col("clips"),c.id,Object.assign(stripC(c),{status:"rejected",reviewNote:formObj(ev.target).note,reviewedBy:S.uid,updatedAt:new Date().toISOString()}))){closeModal();toast("Sent back")}}));return true}
    save(col("clips"),c.id,Object.assign(stripC(c),{status:v,reviewNote:v==="approved"?"":c.reviewNote||"",reviewedBy:v==="approved"?S.uid:c.reviewedBy||"",updatedAt:new Date().toISOString()})).then(ok=>ok&&toast("Updated"));return true}
  if(a==="st-addep"){openModal('<h3>Add an episode</h3><form id="mf" style="display:flex;flex-direction:column;gap:12px"><label class="f">Title *<input class="i" name="title" required></label><label class="f">Date<input class="i" type="date" name="date" value="'+today()+'"></label><label class="f">YouTube link (optional)<input class="i" type="url" name="yt"></label><div class="row"><button type="button" class="btn ghost" data-act="close-modal">Cancel</button><button class="btn olive">Add</button></div></form>',
    el=>el.querySelector("#mf").addEventListener("submit",async ev=>{ev.preventDefault();const o=formObj(ev.target);const m=/(?:v=|youtu\.be\/|live\/)([A-Za-z0-9_-]{11})/.exec(o.yt||"");const id=m?m[1]:"ep-"+uid();

async function saveSong(form){

/* ---------- original abstract art (used when a spot has no photo) ---------- */
function sculpt(seed,c1,c2,c3,cls){
  let s=seed*9301+49297;const r=()=>{s=(s*9301+49297)%233280;return s/233280};
  const g="sg"+seed+Math.floor(r()*1e5);
  const band=(i)=>{const y=40+r()*120,a=r()*80-40,w=26+r()*30;const x0=-20,x3=420;const p=`M${x0} ${y} C ${120+r()*60} ${y-90+a} ${220+r()*60} ${y+90-a} ${x3} ${y-20+r()*40}`;
    return `<path d="${p}" stroke="url(#${g}b${i})" stroke-width="${w}" fill="none" stroke-linecap="round" opacity=".95"/><path d="${p}" stroke="#fff" stroke-opacity=".28" stroke-width="1.4" fill="none" transform="translate(0 ${-w/2+3})"/>`};
  return `<svg class="sculpt ${cls||""}" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>`+
    [0,1,2].map(i=>`<linearGradient id="${g}b${i}" x1="0" x2="1" y1="${i%2}" y2="${1-i%2}"><stop offset="0" stop-color="${[c1,c2,c3][i%3]}" stop-opacity="0"/><stop offset=".45" stop-color="${[c1,c2,c3][i%3]}"/><stop offset=".7" stop-color="${[c2,c3,c1][i%3]}"/><stop offset="1" stop-color="${c3}" stop-opacity=".15"/></linearGradient>`).join("")+
    `<radialGradient id="${g}o" cx=".7" cy=".3" r=".6"><stop offset="0" stop-color="${c1}" stop-opacity=".55"/><stop offset="1" stop-color="${c1}" stop-opacity="0"/></radialGradient><filter id="${g}f"><feGaussianBlur stdDeviation="6"/></filter></defs>`+
    `<rect width="400" height="260" fill="url(#${g}o)"/><g filter="url(#${g}f)" opacity=".55">${band(9)}</g>${band(0)}${band(1)}${band(2)}</svg>`;
}

  const out=[],eq=(a,b)=>stable(prune(a))===stable(prune(b)),ds=D.studio||{},ps=P.studio||{};

const okLink=u=>!u||/^#[A-Za-z0-9\-\/_]*$/.test(u)||/^https:\/\/[^\s"<>]+$/.test(u)||/^\/[A-Za-z0-9\-\/_]*$/.test(u);
function wsValidate(D){
  const err=[],warn=[],H=Object.assign({},DEF.home,D.home||{}),st=D.studio||{};

async function wsDoPublish(changed,note){
  try{
    clearTimeout(wsT);if(S.draft)await draftWrite();
    const D=wsDraft(),P=S.site||{},n=(Number(P.version)||0)+1,at=nowIso();
    const content={};PK.forEach(k=>{if(D[k]!==undefined)content[k]=clone(D[k])});content.assets=libRegistry(D);
    const batch=S.db.batch();
    if(!P.version){const base={};PK.forEach(k=>{if(P[k]!==undefined)base[k]=clone(P[k])});base.assets=clone(P.assets||{});
      batch.set(S.db.doc("siteversions/v0000"),{version:0,at,by:"",byEmail:"",note:"The site before Website Studio",changed:[],content:base})}
    const base0=clone(P);PK.concat(["assets"]).forEach(k=>delete base0[k]);const live=Object.assign(base0,content,{version:n,publishedAt:at,publishedBy:S.uid||"",publishedByEmail:S.email||""});
    batch.set(S.db.doc("settings/site"),live);
    batch.set(S.db.doc("siteversions/v"+String(n).padStart(4,"0")),{version:n,at,by:S.uid||"",byEmail:S.email||"",note:note||"",changed:changed||[],content});
    await batch.commit();
    try{await fetch("/api/site/purge",{method:"POST",headers:{authorization:"Bearer "+await idToken()}})}catch(e){}
    openModal('<h3>Version '+n+' is live</h3><p class="muted">Published '+esc(new Date(at).toLocaleString("en-US",{dateStyle:"medium",timeStyle:"short"}))+'. Visitors see the new content now; phones that have the site open pick it up automatically.</p><div class="row"><a class="btn ghost" href="/#home" target="_blank" rel="noopener">View live site ↗</a><button class="btn olive" data-act="close-modal">Done</button></div>');
    return true;
  }catch(e){toast(/permission/.test(String(e&&e.code))?"Firebase blocked publishing. Publish the latest firestore.rules first.":"Couldn't publish. Check your connection and try again.");return false}
}

/* ---------- uploads ---------- */
const newAssetId=()=>"as_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sitePut=(id,rev,v,blob,type,onp)=>xhrPut("/api/site/put?id="+id+"&rev="+rev+"&v="+v,blob,type,onp);
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.decoding="async";i.onload=()=>res(i);i.onerror=()=>rej(new Error("This browser couldn't open that image"));i.src=src})}
async function encodeVar(img,maxW,crop,q){const cw=img.naturalWidth,ch=img.naturalHeight,c=crop||{x:0,y:0,w:1,h:1};const sx=c.x*cw,sy=c.y*ch,sw=Math.max(1,c.w*cw),sh=Math.max(1,c.h*ch),k=Math.min(1,maxW/sw);
  const w=Math.max(1,Math.round(sw*k)),h=Math.max(1,Math.round(sh*k)),cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,w,h);
  let b=await new Promise(r=>cv.toBlob(r,"image/webp",q||.84));if(!b||b.type!=="image/webp")b=await new Promise(r=>cv.toBlob(r,"image/jpeg",q||.86));if(!b)throw new Error("Couldn't process that image");return {blob:b,w,h}}
function videoFrame(src,at){return new Promise((res,rej)=>{const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";v.src=src;const to=setTimeout(()=>rej(new Error("timeout")),20000);
  v.onloadedmetadata=()=>{v.currentTime=at!=null?Math.min(at,Math.max(0,v.duration-.1)):Math.min(1,(v.duration||0)/3)};
  v.onseeked=async()=>{try{clearTimeout(to);const k=Math.min(1,1280/(v.videoWidth||1280)),cv=document.createElement("canvas");cv.width=Math.round((v.videoWidth||1280)*k);cv.height=Math.round((v.videoHeight||720)*k);cv.getContext("2d").drawImage(v,0,0,cv.width,cv.height);
    let b=await new Promise(r=>cv.toBlob(r,"image/webp",.82));if(!b||b.type!=="image/webp")b=await new Promise(r=>cv.toBlob(r,"image/jpeg",.85));res({blob:b,dur:v.duration,w:v.videoWidth,h:v.videoHeight})}catch(e){rej(e)}};
  v.onerror=()=>{clearTimeout(to);rej(new Error("This browser can't read that video"))}})}
async function buildImageVariants(id,rev,img,crop,mobileImg,onp){const d=await encodeVar(img,2000,crop),m=mobileImg?await encodeVar(mobileImg,900):await encodeVar(img,900,crop),t=await encodeVar(img,480,crop,.8);
  await sitePut(id,rev,"d",d.blob,d.blob.type);if(onp)onp(.4);await sitePut(id,rev,"m",m.blob,m.blob.type);if(onp)onp(.7);await sitePut(id,rev,"t",t.blob,t.blob.type);if(onp)onp(1);
  return {ve:d.blob.type==="image/webp"?"webp":"jpg"}}
function upqRender(){let q=$("#upq");const L=S.ws.up.filter(x=>!x.hide);if(!L.length){if(q)q.remove();return}
  if(!q){q=document.createElement("div");q.id="upq";q.setAttribute("aria-live","polite");document.body.appendChild(q)}
  q.innerHTML='<div class="uqh"><b>Uploads</b><button class="mini" data-act="upq-clear" aria-label="Close">✕</button></div>'+L.map(x=>'<div class="uqi'+(x.err?" err":x.done?" ok":"")+'"><span>'+esc(x.name)+'</span><small>'+(x.err?esc(x.err):x.done?"Done":Math.round(x.pct*100)+"%")+'</small><i style="width:'+Math.round((x.done?1:x.pct)*100)+'%"></i></div>').join("")}
async function libUpload(files,folder,cb){const made=[];
  for(const f of files){
    const type=f.type||(/\.avif$/i.test(f.name)?"image/avif":/\.mov$/i.test(f.name)?"video/quicktime":/\.mp4$/i.test(f.name)?"video/mp4":"");
    const q={name:f.name,pct:0,err:"",done:false};S.ws.up.push(q);upqRender();
    try{
      if(!IMG_T.test(type)&&!VID_T.test(type))throw new Error("Use JPG, PNG, WebP, AVIF, MP4, WebM or MOV");
      const isV=VID_T.test(type);if(f.size>(isV?95:30)*1048576)throw new Error(isV?"Over 95 MB. Add it as a YouTube or Vimeo link instead.":"Images can be up to 30 MB");
      const id=newAssetId(),rec={id,name:f.name.replace(/\.[^.]+$/,"").slice(0,80),kind:isV?"video":"image",type,ext:EXT_OF[type],size:f.size,folder:folder||"",tags:[],alt:"",focal:"50% 50%",rev:1,orev:1,ready:false,createdAt:nowIso(),by:S.uid||"",byEmail:S.email||""};
      const url=URL.createObjectURL(f);
      if(isV){let info=null;try{info=await videoFrame(url)}catch(e){}
        await sitePut(id,1,"o",f,type,p=>{q.pct=p*.95;upqRender()});
        if(info&&info.blob){await sitePut(id,1,"t",info.blob,info.blob.type);rec.poster=true;rec.ve=info.blob.type==="image/webp"?"webp":"jpg"}
        Object.assign(rec,{dur:info?Math.round(info.dur||0):0,w:info?info.w:0,h:info?info.h:0});
      }else{const img=await loadImg(url);rec.w=img.naturalWidth;rec.h=img.naturalHeight;
        await sitePut(id,1,"o",f,type,p=>{q.pct=p*.6;upqRender()});
        Object.assign(rec,await buildImageVariants(id,1,img,null,null,p=>{q.pct=.6+p*.4;upqRender()}))}
      URL.revokeObjectURL(url);
      rec.ready=true;rec.updatedAt=nowIso();await S.db.doc("mediaLib/"+id).set(rec);S.lib[id]=rec;q.done=true;made.push(id);upqRender();
    }catch(e){q.err=(e&&e.message)||"Upload failed";upqRender()}
  }
  setTimeout(()=>{S.ws.up=S.ws.up.filter(x=>!x.done);upqRender()},6000);
  if(cb&&made.length)cb(made);
}

  el=>el.querySelector("#lkf").addEventListener("submit",async ev=>{ev.preventDefault();const o=formObj(ev.target);if(!/^https:\/\//.test(o.url)){toast("The link needs to start with https://");return}

/* ---------- file details: alt text, folder, crop, phone version, video thumbnail, replace, delete ---------- */
async function varBlob(A,v){const r=await fetch(assetUrl(A,v));if(!r.ok)throw new Error("Couldn't load the file");return r.blob()}
async function libRebuild(A,opts,msg){
  toast(msg||"Updating…");const rev=(Number(A.rev)||1)+1,upd={rev,updatedAt:nowIso()};
  try{
    if(A.kind==="image"){const ob=await varBlob(A,"o"),ou=URL.createObjectURL(ob),img=await loadImg(ou);
      const crop=opts.crop!==undefined?opts.crop:(A.crop||null);let mImg=null;
      if(opts.mobileFile){mImg=await loadImg(URL.createObjectURL(opts.mobileFile));upd.mcustom=true}
      else if(A.mcustom&&!opts.mobileAuto){mImg=await loadImg(URL.createObjectURL(await varBlob(A,"m")))}
      else upd.mcustom=false;
      Object.assign(upd,await buildImageVariants(A.id,rev,img,crop,mImg));upd.crop=crop;URL.revokeObjectURL(ou);
    }else if(A.kind==="video"){const fr=opts.frame;await sitePut(A.id,rev,"t",fr,fr.type);upd.poster=true;upd.ve=fr.type==="image/webp"?"webp":"jpg"}
    await S.db.doc("mediaLib/"+A.id).update(upd);toast("Saved. Publish to use it on the live site.");return true;
  }catch(e){toast((e&&e.message)||"Couldn't update the file");return false}

async function libReplace(A,f){

function cropUI(box,init){let c=Object.assign({x:0,y:0,w:1,h:1},init),ar=0;const el=box.querySelector(".crop"),R=()=>box.getBoundingClientRect();
  const paint=()=>{el.style.left=c.x*100+"%";el.style.top=c.y*100+"%";el.style.width=c.w*100+"%";el.style.height=c.h*100+"%"};
  const fit=()=>{if(ar){const r=R(),k=r.width/r.height;let w=c.w,h=w*k/ar;if(h>1){h=1;w=h*ar/k}if(w>1){w=1;h=w*k/ar}c.w=w;c.h=h;c.x=Math.min(c.x,1-w);c.y=Math.min(c.y,1-h)}paint()};
  el.addEventListener("pointerdown",e=>{e.preventDefault();const size=e.target.classList.contains("h"),r=R(),sx=e.clientX,sy=e.clientY,o=Object.assign({},c);el.setPointerCapture(e.pointerId);

      if(!size){c.x=Math.min(1-c.w,Math.max(0,o.x+dx));c.y=Math.min(1-c.h,Math.max(0,o.y+dy))}
      else{c.w=Math.min(1-c.x,Math.max(.06,o.w+dx));c.h=ar?c.w*(r.width/r.height)/ar:Math.min(1-c.y,Math.max(.06,o.h+dy));if(c.y+c.h>1){c.h=1-c.y;if(ar)c.w=c.h*ar/(r.width/r.height)}}paint()};

}

function wsAct(a,t){
  if(!a.startsWith("ws-")&&!a.startsWith("ml-")&&!a.startsWith("pk-")&&a!=="upq-clear")return false;
  if(a==="upq-clear"){S.ws.up=S.ws.up.filter(x=>!x.done&&!x.err&&x.pct<1);S.ws.up.forEach(x=>x.hide=true);upqRender();return true}
  if(!S.isAdmin)return true;

  if(a==="ws-dev"){S.ws.dev=t.dataset.v;document.querySelectorAll("#wsDev button").forEach(b=>b.classList.toggle("on",b===t));const box=$("#wsDevBox");if(box)box.className="wsdev d-"+S.ws.dev;if(S.ws.fit)S.ws.fit();return true}

  if(a==="ws-pick"){const slot=t.dataset.slot,path=t.dataset.path,acc=t.dataset.accept||"image";
    wsPicker(acc,id=>{const A=S.lib[id];if(!A||!acc.split(",").includes(A.kind)){toast("That file type doesn't fit here");return}

  if(a==="pk-pick"){const cb=S.ws.pickCb;if(cb)cb(t.dataset.id);return true}
  if(a==="ws-crop"){wsCropSlot(t.dataset.slot);return true}

    if(a==="ws-q-move"){const j=i+Number(t.dataset.d);if(j<0||j>=L.length)return true;[L[i],L[j]]=[L[j],L[i]]}

    draftSet("studio.home.quick.items",L,true);wsRefreshAll();return true}
  if(a==="ws-ord"){const L=clone(wsVal(t.dataset.p)||[]),i=Number(t.dataset.i),j=i+Number(t.dataset.d);["quick","story"].forEach(k=>{if(!L.includes(k))L.push(k)});if(j<0||j>=L.length)return true;[L[i],L[j]]=[L[j],L[i]];draftSet(t.dataset.p,L,true);wsRefreshAll();return true}
  if(a==="ws-trend"){let L=clone(wsVal("studio.music.trendIds")||[]);const id=t.dataset.id;if(t.checked){if(L.length>=12){t.checked=false;toast("Pick up to 12 songs");return true}L.push(id)}else L=L.filter(x=>x!==id);draftSet("studio.music.trendIds",L,true);return true}

    el=>el.querySelector("#nff").addEventListener("submit",async ev=>{ev.preventDefault();const n=formObj(ev.target).n;if(!n)return;const fs=[...new Set((S.wsMeta.folders||[]).concat(n))].sort();if(await save("sitedraft","meta",Object.assign({},S.wsMeta,{folders:fs}))){S.ws.lf=n;closeModal();render()}}));return true}

  return false;

const csBytes=n=>n>1e9?(n/1e9).toFixed(2)+" GB":n>1e6?(n/1e6).toFixed(1)+" MB":Math.round((n||0)/1e3)+" KB";
async function csCleanup(silent){if(!csFounder())return;const st=csSet(),now=Date.now(),day=86400000;let files=[],bytes=0,docs=0;
  try{
    const keep=new Set();csBrandList(true).forEach(b=>(b.logos||[]).concat(b.imagery||[]).forEach(l=>keep.add(l.key)));
    const posts=Object.values(CS.posts),activeCamp=id=>{const c=CS.camps[id];return c&&!c.archived};
    for(const p of posts){const age=now-Date.parse(p.updatedAt||p.createdAt||0);
      if(p.status==="rejected"&&!p.protected&&age>st.rejectedDays*day&&!(p.campaignId&&activeCamp(p.campaignId))){[p.bgKey,p.finalKey].filter(k=>k&&!k.startsWith("content/brand/")).forEach(k=>files.push(k));await remove("contentPosts",p.id);docs++;continue}
      if(p.status==="published"&&!p.protected&&st.publishedDays>0&&now-Date.parse(p.publishedAt||p.updatedAt||0)>st.publishedDays*day&&(p.bgKey||p.finalKey)){[p.bgKey,p.finalKey].filter(k=>k&&!k.startsWith("content/brand/")).forEach(k=>files.push(k));await csSave("contentPosts",p.id,Object.assign({},p,{bgKey:"",finalKey:"",archivedImages:true}));docs++;continue}
      [p.bgKey,p.finalKey].forEach(k=>k&&keep.add(k))}
    for(const pre of ["content/keep/","content/final/","content/upload/"]){const j=await csApi("files?prefix="+encodeURIComponent(pre));(j.files||[]).forEach(f=>{if(!keep.has(f.key)&&now-Date.parse(f.uploaded)>Math.max(2,st.unusedDays)*day){files.push(f.key);bytes+=f.size||0}})}
    files=[...new Set(files)];for(let i=0;i<files.length;i+=150)await csApi("delete",{keys:files.slice(i,i+150)});

function csHolidays(y){const nth=(m,dow,n)=>{const d=new Date(y,m,1);let c=0;while(true){if(d.getDay()===dow&&++c===n)break;d.setDate(d.getDate()+1)}return d},last=(m,dow)=>{const d=new Date(y,m+1,0);while(d.getDay()!==dow)d.setDate(d.getDate()-1);return d};const f=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

function lightbox(A){
  let inner=null;
  if(A.kind==="video")inner='<video src="'+esc(assetUrl(A,"o"))+'" controls autoplay playsinline'+(A.poster?' poster="'+esc(assetUrl(A,"t"))+'"':'')+'></video>';
  else{const y=ytId(A.url),v=vimeoId(A.url);
    inner=y?'<iframe src="https://www.youtube-nocookie.com/embed/'+y+'?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Grooveville video"></iframe>':
      v?'<iframe src="https://player.vimeo.com/video/'+v+'?autoplay=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="Grooveville video"></iframe>':
      /^https:\/\/.+\.(mp4|webm)(\?.*)?$/i.test(A.url)?'<video src="'+esc(A.url)+'" controls autoplay playsinline></video>':null}
  if(!inner){window.open(A.url,"_blank","noopener");return}
  const was=MP.playing;if(was)mpPause(false);try{if(window.__liveStop)window.__liveStop()}catch(e){}
  const o=document.createElement("div");o.id="lbx";o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");o.setAttribute("aria-label","Video");
  o.innerHTML='<div class="lbin">'+inner+'</div><button class="mx" data-act="lbx-close" aria-label="Close video">✕</button>';o._was=was;document.body.appendChild(o);o.querySelector(".mx").focus();
}
function lbxClose(){const o=$("#lbx");if(!o)return;const was=o._was;o.remove();if(was)mpResume()}

const RV_SEL=".cocard,.qcard,.story,.rfeat,.tcard,.msec,.mtile,.cohead,.hhtx";
let RVO=null;
function rvRun(fresh){
  const els=document.querySelectorAll("#app "+RV_SEL.split(",").join(",#app "));
  if(!fresh||matchMedia("(prefers-reduced-motion: reduce)").matches||!("IntersectionObserver" in window)){els.forEach(e=>e.classList.remove("rv"));return}
  if(!RVO)RVO=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add("in");RVO.unobserve(en.target)}}),{rootMargin:"0px 0px -6% 0px"});
  els.forEach((e,i)=>{e.classList.add("rv");e.style.setProperty("--rd",Math.min(i,8)*45+"ms");RVO.observe(e)});
  setTimeout(()=>els.forEach(e=>e.classList.add("in")),1600);   // never leave anything hidden
}

/* ---------- Events on Groove Guide (Explore › Grooveville Live) ----------
   Extra fields on public calendar events: event group, a Google-matched venue, venue image (Google photo or your own),
   a flyer, and a ticket / RSVP link. Images live in eventMedia/{eventId} so the public site doesn't download them
   with every page load; the event itself stays in events/{id} like before. */
const EVG={maps:null,loading:null,sess:null,sug:[],photoTok:0};
async function evgMaps(){
  if(EVG.maps)return EVG.maps;if(EVG.loading)return EVG.loading;
  EVG.loading=(async()=>{
    if(!(window.google&&google.maps&&google.maps.importLibrary)){
      const r=await fetch("/api/guide/config",{credentials:"same-origin"});const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.googleMapsKey)throw new Error("Google address search needs the Groove Guide map key in Cloudflare (GOOGLE_MAPS_BROWSER_KEY).");
      await new Promise((res,rej)=>{window.__evgReady=res;const s=document.createElement("script");s.async=true;
        s.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(j.googleMapsKey)+"&v=beta&loading=async&callback=__evgReady";s.onerror=()=>rej(new Error("Google Maps didn't load"));document.head.appendChild(s)});
    }
    EVG.maps=await google.maps.importLibrary("places");return EVG.maps})();
  try{return await EVG.loading}catch(e){EVG.loading=null;throw e}
}
function evgShrink(file,maxPx,maxLen){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
  let px=maxPx,q=.85,out="";for(let k=0;k<8;k++){const sc=Math.min(1,px/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
    const cx=c.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,c.width,c.height);cx.drawImage(img,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",q);if(out.length<=maxLen)break;if(q>.6)q-=.1;else px=Math.round(px*.8)}
  res(out.length<=maxLen?out:(toast("That image is too large. Try a smaller one."),null))};img.onerror=()=>{toast("That file isn't an image we can read");res(null)};img.src=r.result};r.readAsDataURL(file)})}
const EVG_TICKETS=[["","No tickets needed"],["rsvp","RSVP"],["tickets","Tickets (paid)"],["free","Free, register"]];
function evGuideHtml(d){
  const groups=[...new Set((S.events||[]).map(e=>e.group).filter(Boolean))].sort();
  const p=d.place||{};
  return '<fieldset id="evg" style="border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;margin:0;display:flex;flex-direction:column;gap:10px"><legend style="font-size:13px;font-weight:600;color:var(--muted);padding:0 6px">Groove Guide</legend>'+
    '<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="evg-on" name="guide"'+(d.guide!==false?" checked":"")+'> Show under <b>Grooveville Live</b> on Groove Guide</label>'+
    '<p class="muted" id="evg-note" style="font-size:12.5px;margin:-4px 0 0">Public events only. It drops off on its own once it’s over; repeating events show their next date.</p>'+
    '<label class="f">Event group or series<input class="i" id="evg-group" name="group" list="evg-groups" value="'+esc(d.group||"")+'" placeholder="e.g. The Unc &amp; Neph Show"><datalist id="evg-groups">'+groups.map(g=>'<option value="'+esc(g)+'">').join("")+'</datalist></label>'+
    '<label class="f" style="position:relative">Address or venue<input class="i" id="evg-addr" autocomplete="off" value="'+esc(p.name?(p.name+(p.addr&&p.addr.indexOf(p.name)!==0?", "+p.addr:"")):(d.location||""))+'" placeholder="Search a venue or address">'+
      '<div id="evg-sug" class="evgsug" hidden></div><small class="muted" id="evg-placeinfo" style="font-size:12px">'+(p.id?"Matched on Google ✓ "+esc(p.addr||""):"Pick a suggestion so Groove Guide can route people there.")+'</small></label>'+
    '<div class="evgimgs"><div class="evgimg"><span class="evgl">Venue image</span><div class="seg" id="evg-vseg"><button type="button" data-v="google" class="'+((d.venueSrc||"google")==="google"?"on":"")+'">Google photo</button><button type="button" data-v="upload" class="'+(d.venueSrc==="upload"?"on":"")+'">My own</button><button type="button" data-v="none" class="'+(d.venueSrc==="none"?"on":"")+'">None</button></div>'+
      '<div class="evgprev" id="evg-vprev"></div><input type="file" accept="image/*" id="evg-vfile" hidden></div>'+
      '<div class="evgimg"><span class="evgl">Flyer</span><div class="evgprev tall" id="evg-fprev"></div><div class="row l" style="margin:0"><button type="button" class="btn ghost sm" id="evg-fbtn">Upload flyer</button><button type="button" class="btn ghost sm" id="evg-frm" hidden>Remove</button></div><input type="file" accept="image/*" id="evg-ffile" hidden></div></div>'+
    '<div class="grid2"><label class="f">Tickets<select class="i" id="evg-ticket" name="ticket">'+EVG_TICKETS.map(([v,l])=>'<option value="'+v+'"'+((d.ticket||"")===v?" selected":"")+'>'+l+'</option>').join("")+'</select></label></div>'+
  '</fieldset>';
}
function evGuideInit(el,d){
  const st=el._evg={place:d.place||null,venueSrc:d.venueSrc||"google",venue:null,flyer:null,mediaLoaded:!d.id,changed:false};
  const $e=s=>el.querySelector(s);
  const vis=()=>{const pub=$e("#ev-vis").value==="public";$e("#evg").style.opacity=pub?"":".55";$e("#evg-note").textContent=pub?"Public events only. It drops off on its own once it’s over; repeating events show their next date.":"Switch the event to Public to show it on Groove Guide."};
  el.querySelectorAll("#ev-visseg button").forEach(b=>b.addEventListener("click",()=>setTimeout(vis,0)));vis();
  /* the old Location box becomes the Google-matched address */
  const loc=$e("#ev-loc");if(loc)loc.closest("label").hidden=true;
  const tl=$e("#ev-link");if(tl){const lab=tl.closest("label");lab.firstChild.textContent="Ticket, RSVP or info link";const tk=$e("#evg-ticket");tk.closest(".grid2").appendChild(lab)}
  const addr=$e("#evg-addr"),box=$e("#evg-sug"),info=$e("#evg-placeinfo");let t=0;
  const syncLoc=()=>{if(loc)loc.value=st.place?(st.place.name&&st.place.addr&&st.place.addr.indexOf(st.place.name)!==0?st.place.name+", "+st.place.addr:(st.place.addr||st.place.name)):addr.value.trim()};
  addr.addEventListener("input",()=>{st.place=null;info.textContent="Pick a suggestion so Groove Guide can route people there.";syncLoc();clearTimeout(t);const q=addr.value.trim();if(q.length<3){box.hidden=true;return}
    t=setTimeout(async()=>{try{const P=await evgMaps();EVG.sess=EVG.sess||new P.AutocompleteSessionToken();
      const {suggestions}=await P.AutocompleteSuggestion.fetchAutocompleteSuggestions({input:q,sessionToken:EVG.sess,locationBias:{center:{lat:35.2271,lng:-80.8431},radius:50000}});
      if(addr.value.trim()!==q)return;EVG.sug=(suggestions||[]).filter(x=>x.placePrediction).slice(0,6);
      box.innerHTML=EVG.sug.map((x,i)=>{const p=x.placePrediction;return '<button type="button" data-i="'+i+'"><b>'+esc(p.mainText?p.mainText.text:p.text.text)+'</b><small>'+esc(p.secondaryText?p.secondaryText.text:"")+'</small></button>'}).join("")+'<small class="evgattr">powered by Google</small>';box.hidden=!EVG.sug.length}
      catch(e){box.hidden=true;info.textContent=String(e.message||e)}},250)});
  addr.addEventListener("blur",()=>setTimeout(()=>box.hidden=true,200));
  box.addEventListener("click",async ev=>{const b=ev.target.closest("[data-i]");if(!b)return;box.hidden=true;const x=EVG.sug[Number(b.dataset.i)];if(!x)return;
    try{const pl=x.placePrediction.toPlace();await pl.fetchFields({fields:["id","displayName","formattedAddress","location","photos"]});EVG.sess=null;
      st.place={id:pl.id,name:pl.displayName||"",addr:pl.formattedAddress||"",lat:pl.location.lat(),lng:pl.location.lng()};st._photos=pl.photos||[];
      addr.value=st.place.name+(st.place.addr&&st.place.addr.indexOf(st.place.name)!==0?", "+st.place.addr:"");info.textContent="Matched on Google ✓ "+st.place.addr;syncLoc();vprev()}
    catch(e){toast("Couldn't open that place. Try again.")}});
  /* venue image */
  const vp=$e("#evg-vprev");
  const vprev=async()=>{const tok=++EVG.photoTok;
    if(st.venueSrc==="none"){vp.innerHTML='<span class="muted">No venue image</span>';return}
    if(st.venueSrc==="upload"){vp.innerHTML=st.venue?'<img src="'+st.venue+'" alt=""><button type="button" class="btn ghost sm" id="evg-vchg">Change</button>':(!st.mediaLoaded?'<span class="muted">Loading…</span>':'<button type="button" class="btn ghost sm" id="evg-vchg">Choose image</button>');const c=$e("#evg-vchg");if(c)c.onclick=()=>$e("#evg-vfile").click();return}
    if(!st.place||!st.place.id){vp.innerHTML='<span class="muted">Pick the venue above and Google’s photo shows here.</span>';return}
    vp.innerHTML='<span class="muted">Loading Google photo…</span>';
    try{let ph=st._photos;if(!ph){const P=await evgMaps();const pl=new P.Place({id:st.place.id});await pl.fetchFields({fields:["photos"]});ph=st._photos=pl.photos||[]}
      if(tok!==EVG.photoTok)return;const f=ph[0];vp.innerHTML=f?'<img src="'+esc(f.getURI({maxWidth:640}))+'" alt=""><small class="evgattr">Photo: '+esc((f.authorAttributions&&f.authorAttributions[0]&&f.authorAttributions[0].displayName)||"Google")+'</small>':'<span class="muted">Google has no photo for this place. Upload your own.</span>'}
    catch(e){vp.innerHTML='<span class="muted">'+esc(String(e.message||"Google photo unavailable"))+'</span>'}};
  el.querySelectorAll("#evg-vseg button").forEach(b=>b.addEventListener("click",()=>{el.querySelectorAll("#evg-vseg button").forEach(x=>x.classList.toggle("on",x===b));st.venueSrc=b.dataset.v;st.changed=true;vprev();if(b.dataset.v==="upload"&&!st.venue&&st.mediaLoaded)$e("#evg-vfile").click()}));
  $e("#evg-vfile").addEventListener("change",async ev=>{const f=ev.target.files[0];ev.target.value="";if(!f)return;const v=await evgShrink(f,1000,220000);if(v){st.venue=v;st.changed=true;vprev()}});
  /* flyer */
  const fp=$e("#evg-fprev"),frm=$e("#evg-frm");
  const fprev=()=>{fp.innerHTML=st.flyer?'<img src="'+st.flyer+'" alt="Flyer">':'<span class="muted">'+(st.mediaLoaded?"No flyer yet":"Loading…")+'</span>';frm.hidden=!st.flyer;$e("#evg-fbtn").textContent=st.flyer?"Replace flyer":"Upload flyer"};
  $e("#evg-fbtn").addEventListener("click",()=>$e("#evg-ffile").click());
  $e("#evg-ffile").addEventListener("change",async ev=>{const f=ev.target.files[0];ev.target.value="";if(!f)return;const v=await evgShrink(f,1500,560000);if(v){st.flyer=v;st.changed=true;fprev()}});
  frm.addEventListener("click",()=>{st.flyer=null;st.changed=true;fprev()});
  fprev();vprev();
  if(d.id&&S.db)S.db.collection("eventMedia").doc(d.id).get().then(s=>{const m=s.exists?s.data():{};st.venue=m.venue||null;st.flyer=m.flyer||null;st.mediaLoaded=true;fprev();vprev()}).catch(()=>{st.mediaLoaded=true;fprev();vprev()});
}
/* adds the Groove Guide fields to the event record; saves images separately */
function evGuideRec(el,rec){const st=el._evg;if(!st)return rec;const g=el.querySelector("#evg-on");
  return Object.assign(rec,{guide:!!(g&&g.checked),group:(el.querySelector("#evg-group").value||"").trim().slice(0,80),place:st.place||null,venueSrc:st.venueSrc,ticket:el.querySelector("#evg-ticket").value||"",
    hasFlyer:!!st.flyer,hasVenueImg:st.venueSrc==="upload"&&!!st.venue})}
async function evGuideSave(el,id){const st=el._evg;if(!st||!S.db||!st.mediaLoaded||!st.changed)return true;
  try{if(!st.flyer&&!(st.venueSrc==="upload"&&st.venue))await S.db.collection("eventMedia").doc(id).delete();
    else await S.db.collection("eventMedia").doc(id).set({flyer:st.flyer||"",venue:st.venueSrc==="upload"&&st.venue?st.venue:"",updatedAt:new Date().toISOString()});return true}
  catch(e){toast(/permission/.test(String(e&&e.code))?"The event saved, but Firebase blocked the images. Publish the latest rules (eventMedia).":"The event saved, but the images didn't. Try again.");return false}}

function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
  let q=.7,max=1100,out;for(let i=0;i<5;i++){const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",q);if(out.length<230000)break;q-=.12;max=Math.round(max*.8)}
  res(out.length<250000?out:null)};img.onerror=()=>{toast("That file isn't an image we can read");res(null)};img.src=r.result};r.readAsDataURL(file)})}

function shrinkLogo(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
  const sc=Math.min(1,320/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);let out=c.toDataURL("image/webp",.88);if(!out.startsWith("data:image/webp"))out=c.toDataURL("image/png");
  if(out.length>60000)out=c.toDataURL("image/webp",.7);res(out.length<90000?out:(toast("That logo is too large. Try a smaller image."),null))};
  img.onerror=()=>{toast("That file isn't an image we can read");res(null)};img.src=r.result};r.readAsDataURL(file)})}
function readRepeat(el,o){

  const days=(r==="weekly"||r==="biweekly")?[...el.querySelectorAll("[data-dow].on")].map(b=>Number(b.dataset.dow)):[];
  return {repeat:r,days,until:o.ends==="until"?(o.until||""):"",count:o.ends==="count"?String(Math.max(2,Number(o.count)||0)||""):"",exdates:(el._ex||[]).slice()};

function b64utf8(s){const b=new TextEncoder().encode(s);let o="";for(let i=0;i<b.length;i+=8192)o+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(o)}
function fromb64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
async function publishSite(btn){
  if(BACKEND==="firebase"){wsPublishFlow();return}
  const art=await cu("artifact");
  if(!art){toast("Publishing isn't available in this view");return}
  if(btn)btn.disabled=true;
  const tpl=fromb64(SELF_B64);
  const payload=Object.assign(livePublic(),{publishedAt:new Date().toISOString()});
  const json=JSON.stringify(payload).replace(/</g,"\\u003c");
  const body=tpl.replace("__SE"+"LF__",()=>b64utf8(tpl)).replace("__SN"+"AP__",()=>json);
  const html='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+fromb64(RESET)+'</style></head><body>\n'+body+'\n</body></html>';
  try{await art.publish(html);toast("Published. Reloading…")}
  catch(e){if(btn)btn.disabled=false;
    const c=e&&e.code;
    if(c==="conflict")toast("A newer version was just published. Reloading…");
    else if(c==="not_writer"||c==="not_granted")toast("Only the owner and editors can publish.");
    else if(c==="rate_limited")toast("Publishing too often. Wait a minute and try again.");
    else toast("Couldn't publish. Try again in a moment.");}
}

/* ---------- firebase sign in (GitHub version) ---------- */
async function fbAuth(form,mode){
  const m=$("#authMsg"),o=formObj(form);m.textContent=mode==="up"?"Creating your account…":"Signing in…";
  try{
    if(mode==="up"){const c=await firebase.auth().createUserWithEmailAndPassword(o.email,o.password);
      await S.db.doc("memberlog/"+c.user.uid).set({email:o.email,joinedAt:new Date().toISOString()});}
    else await firebase.auth().signInWithEmailAndPassword(o.email,o.password);
  }catch(e){const c=e&&e.code||"";m.textContent=/wrong-password|invalid-credential|user-not-found/.test(c)?"That email and password don't match. Try again or reset your password.":/email-already/.test(c)?"An account with that email already exists. Sign in instead.":/weak-password/.test(c)?"Use a password with at least 6 characters.":"Couldn't sign in. Check your connection and try again."}
}
async function fbReset(){
  const em=$("#a-email"),m=$("#authMsg");if(!em||!em.value){if(m)m.textContent="Type your email above first.";return}
  try{await firebase.auth().sendPasswordResetEmail(em.value);m.textContent="Check your email for a reset link."}catch(e){m.textContent="Couldn't send a reset email. Check the address."}
}
